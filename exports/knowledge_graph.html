const DATA={"directed": true, "multigraph": true, "graph": {}, "nodes": [{"kind": "arm", "label": "A1", "id": "arm:A1"}, {"kind": "arm", "label": "A2a", "id": "arm:A2a"}, {"kind": "arm", "label": "A2b", "id": "arm:A2b"}, {"kind": "idea", "label": "Grid-hum liveness: real-time Electrical Network Frequency (ENF) matching to authenticate voice-confirmed high-value instructions", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Voice clones now pass voice biometrics and human call-backs (a bank wired $108M after a cloned lawyer's voice confirmed the instruction). Every current check analyses the voice itself, which is exactly what generative models imitate.", "mechanism": "When a high-value instruction is confirmed on a call, the bank media server isolates the mains-hum component that microphones pick up incidentally (fundamental 50/60 Hz and surviving harmonics 100-180 Hz in wideband/VoIP codecs), tracks its instantaneous frequency with a high-resolution estimator, and derives rate-of-change-of-frequency (RoCoF) features over several simultaneous windows (0.1 s, 1 s, 10 s). It compares these against live phasor-measurement-unit (PMU) grid-frequency data for the caller's claimed grid region over the same timestamps. Grid frequency random-walks unpredictably, so a live call from a powered room in the claimed region correlates, while synthetic TTS/voice-conversion audio carries no hum, a looped or stale hum, or a region-mismatched trajectory. Using multiple windows prevents the short-window grid events (steps) from being averaged away, which is the insight from inertia measurement. The ENF-consistency score is fused as an independent physical factor in the instruction's authorisation.", "novelty_pa": 0.262, "id": "idea:A1-01"}, {"kind": "domain", "label": "fraud", "id": "domain:fraud"}, {"kind": "source", "label": "Italy's biggest private bank wires $108M to scammers who clone a lawyer's voice with AI - VnExpress International", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMi1gFBVV95cUxPclVNMHg0UkZXZ1N2R1RNNkZOa3U1Z0xuTzFtbnY2UWtYN244ZUU4dUtqUWJsQlc0UEVuVkdRMTVzOTVPTVBzZVR5UzhSdTdIQnllNTJtakVFamw2Y21hY1F1cjVoWHZZRFFwR2Rkc2oxcGZkYU40U1NZWFlwX1E5dFYzZGxfOVdhNE9hVF9XcFhOczljY3Zqckg4UldtVFgzb21XYnVQa2MtNEJrWndqSTJiSFR0bV9XZXY5YU1qR1BSRTRFNFQwODl6dnB0ejlQWjVFSEdB?oc=5", "id": "news:ac85f85a216502df"}, {"kind": "source", "label": "Frequency Measurement Practices for Inertia Assessment in Inverter Based Resources Dominated Power Systems", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.34531", "id": "arxiv:2609.34531"}, {"kind": "prior_art", "label": "AI-Enabled Voice Cloning and Spoofing Risks in Speaker Verification Systems: A Comparative Analysis of Empirical Evidence", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/2979066a19169f4f8ee08acb8779d1460f7cef7c", "owner": "", "id": "s2:2979066a19169f4f8ee08acb8779d1460f7cef7c"}, {"kind": "prior_art", "label": "Measurement-Based Bitrate-Energy-Quality Analysis of Neural Audio Codec Decoders on Laptop and Phone Platforms", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.34524", "owner": "", "id": "arxiv:2609.34524"}, {"kind": "prior_art", "label": "Deepfake Audio Detection Using MFCC-Based Acoustic Feature Extraction and Machine Learning Classification: A Comprehensive Framework", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/dc1badb0facb74a5adcb9fa5fc184ac7a05261ae", "owner": "", "id": "s2:dc1badb0facb74a5adcb9fa5fc184ac7a05261ae"}, {"kind": "prior_art", "label": "The Machines Are Calling: Measuring Automated and Synthetic Voices in Unwanted Inbound Calls", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.11137", "owner": "", "id": "arxiv:2609.11137"}, {"kind": "prior_art", "label": "Enkidu: Universal Frequential Perturbation for Real-Time Audio Privacy Protection against Voice Deepfakes", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/a5e9c00497035899bf7de8e9eef426f8905a460a", "owner": "", "id": "arxiv:2507.12932"}, {"kind": "idea", "label": "Camera-free RF occupancy sensing at ATMs to detect coercion and 'helper' card-swap fraud without biometric identification", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Distraction and 'helper' frauds at ATMs (a second person watching the PIN, then swapping the card) and coerced withdrawals are common, especially against the elderly. Camera-based fixes create biometric-misidentification risk: people have been wrongly accused of bank fraud from face-recognition matches.", "mechanism": "The ATM uses its existing Wi-Fi/BLE radio, or a low-cost 60 GHz radar module, to measure channel-state-information perturbations in a defined zone around the fascia during a session. A lightweight model estimates how many bodies are within 0.8 m, where they are relative to the PIN pad, and how they move (leaning in during PIN entry, lingering after card return, a hand approaching the card slot). The transaction state machine consumes this occupancy stream. If multiple occupancy coincides with PIN entry and a high withdrawal, or a second body approaches during card return, the ATM switches to privacy-PIN mode (a randomised keypad layout shown only at a narrow viewing angle), delays dispensing behind an on-screen prompt, requires in-app confirmation, or raises a silent alert. Only anonymous occupancy traces are retained as evidence, so a person can never be falsely identified from them.", "novelty_pa": 0.2333, "id": "idea:A1-02"}, {"kind": "source", "label": "East TN woman mistakenly jailed for months after A.I. flagged her as bank fraud suspect, lawsuit says - WVLT", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxPdGpLRFhXSkZuT1hTdnFpbGNGaTZOS19GRlU1UTIzMmVreHZQcXZ3eng1NHdkRk1pMVh1Z3ViNUpST2ZaWmtjNS1pbWhoazlTOWdScjFNMWk1a0lkYWdVUDZCT3pjS3VHNHF1RjUyb2NoMjVjbnhUdFFLd2VTc2RTMmtFZ2RXVnZXWmY5S1N0cjEta2I1OWZWXzA2XzlvOS1KUWVlWU80SmJ3WU90Z3c0WEZ1dnZPZGVTVDdZRks2VGQ?oc=5", "id": "news:ef870829fd7d3811"}, {"kind": "source", "label": "People effects on IoT indoor wireless channel characterization", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.36196", "id": "arxiv:2609.36196"}, {"kind": "prior_art", "label": "GESTURE RECOGNITION FOR ADVANCED SECURITY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250348857A1/en", "owner": "Truist Bank", "id": "patent:US20250348857A1"}, {"kind": "prior_art", "label": "Gesture recognition for advanced security", "pa_type": "patent", "url": "https://patents.google.com/patent/US12400197B2/en", "owner": "Truist Bank", "id": "patent:US12400197B2"}, {"kind": "prior_art", "label": "Systems and methods for performing non-contact authorization verification for access to a network", "pa_type": "patent", "url": "https://patents.google.com/patent/US12536265B2/en", "owner": "BANK OF AMERICA CORPORATION", "id": "patent:US12536265B2"}, {"kind": "prior_art", "label": "Frictionless authentication and monitoring", "pa_type": "patent", "url": "https://patents.google.com/patent/US12725423B2/en", "owner": "NCR Voyix Corporation", "id": "patent:US12725423B2"}, {"kind": "prior_art", "label": "Machine Learning for Identifying Deepfake-Driven Identity Abuse, Authentication Evasion, and Customer Impersonation in U.S. Banking", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/0aeff6b269c4ad00a69e8ad6142f34f41b115ff0", "owner": "", "id": "s2:0aeff6b269c4ad00a69e8ad6142f34f41b115ff0"}, {"kind": "idea", "label": "Verification-aware payment scheduler using virtual output queues and iterative matching to remove urgency-driven verification bypass", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "Social-engineering scams (such as AI-generated executive messages) exploit cut-off pressure. Instructions awaiting out-of-band verification block FIFO payment queues, and operators under time pressure release them unverified.", "mechanism": "The payment hub keeps a virtual queue per (verification resource, risk class) pair instead of one FIFO. Each scheduling slot, an iterative request-grant-accept matcher with rotating round-robin pointers (as in crossbar switch schedulers) allocates scarce verification resources to pending instructions: call-back agents, biometric re-authentication, dual-control approvers. This guarantees bounded wait, no starvation and no head-of-line blocking of clean payments. An instruction whose verification cannot complete before its cut-off is rescheduled deterministically to the next settlement cycle and the customer is told why. The scheduler has no code path that releases an unverified flagged instruction, so urgency cannot accelerate a flagged payment.", "novelty_pa": 0.261, "id": "idea:A1-03"}, {"kind": "domain", "label": "payments", "id": "domain:payments"}, {"kind": "source", "label": "AI messaging scam costs Italy's top bank Intesa millions, sources say - AOL.ca", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE9ydF83clR2MjB6dTNubHNqeXY2bW5Vay0yZ0h0c1pUQXJ0VlVqMk9QbDlEaTRiQmJRY2NXWlBjWWYxeE1LRmM2Q3Jjdy1oVjZiRlVObm56VnRza1F4WVZhOElBNWpEWUdHZ2JDcjJkZWdBQVVkX0xucW9rRFRyZw?oc=5", "id": "news:4f4357e6fce4f96d"}, {"kind": "source", "label": "Packet iSlip", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.30960", "id": "arxiv:2609.30960"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR TRANSACTION-TRIGGERED ISSUANCE AND AUTOMATED ROTATION OF VIRTUAL PAYMENT CARDS TO PREVENT PAYMENT FRAUD", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260289570A1/en", "owner": "Secure Purchase LLC", "id": "patent:US20260289570A1"}, {"kind": "prior_art", "label": "Agentic Settlement Protocol: An Application Profile for Refundable, Delayed-Fulfilment Agent Commerce on Stablecoin Rails", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/955d923f29657ce10743fb5bca43043c4e79de01", "owner": "", "id": "arxiv:2609.02208"}, {"kind": "prior_art", "label": "Atomic Common-Day Invoice Clearing under Causal Daily Scheduling: Path-Enabled and Bounded-Cycle Policies", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/95d4834e117f7380c8be8da883d6e9456800e0ac", "owner": "", "id": "arxiv:2608.23060"}, {"kind": "prior_art", "label": "Real time cross-matching data", "pa_type": "patent", "url": "https://patents.google.com/patent/US12711475B2/en", "owner": "Visa International Service Association", "id": "patent:US12711475B2"}, {"kind": "prior_art", "label": "Speed, Fraud, and Bank Liquidity: The Operational Architecture of Real-Time Payment Systems", "pa_type": "paper", "url": "https://doi.org/10.2139/ssrn.7270940", "owner": "", "id": "doi:10.2139/ssrn.7270940"}, {"kind": "idea", "label": "Cryptographic co-presence receipts from concurrent UWB ranging for card-present, corporate-approval and exculpatory evidence", "arm": "A1", "run": "2026-09-30", "domain": "identity", "problem": "Remote impersonation (CEO fraud, relay attacks on cards) and false accusations after biometric misidentification both come down to one question: was this person's device physically there? Today there is no verifiable record of presence.", "mechanism": "Terminals (ATMs, branch tablets, POS, and office anchors used for treasury approvals) run a concurrent coded ranging protocol with registered phones: binary transmit/listen codes let many phones in a busy lobby range at the same time instead of one after another, using IEEE 802.15.4z scrambled timestamp sequences for secure distance bounding. For each transaction, both secure elements sign a co-presence receipt {terminal id, device key id, distance upper bound, timestamp, transaction hash}. Receipts are used to (a) require the registered device within X m for card-present or cardless cash, which defeats relay and stolen-card use; (b) require approvers' devices near an office anchor for high-value corporate releases; and (c) serve as cryptographic alibi or corroboration in disputes and investigations. Only receipt hashes go into an append-only log, and the owner reveals a receipt with consent.", "novelty_pa": 0.2454, "id": "idea:A1-04"}, {"kind": "domain", "label": "identity", "id": "domain:identity"}, {"kind": "source", "label": "Grandmother falsely accused of bank fraud sues Fargo, North Dakota, over AI facial recognition - CBS News", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiwAFBVV95cUxQYVNPUGJ3UnpjaGRfVEMzWXhYMGlvZnNqNGFtbUU1WDdiS2lsSnY2dnM2RGVFbkZvXzdJd0dtbllaY2ZONWNtT2o2TWhISEpvcjRKMC10dzZfZGh5eXFwUmx3MVNqMU5wSGc0bElFRFJMMG95c0VMcWlkaHVOZWk5VUw1eF9IbUgwRExKaXZDYzhmNWF4OGFHcW1lbDVndlFuSGtIaHBLNjBfaE5JMXU5a1VHLVJ4N1o1czZsTmJLcjg?oc=5", "id": "news:cbeab915dc24f05b"}, {"kind": "source", "label": "Concurrent Coded Signal-Multiplexing Ranging for Half-Duplex Asynchronous Networks", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.33753", "id": "arxiv:2609.33753"}, {"kind": "prior_art", "label": "System and method for dual remote authentication of digital assisted shopping agents and customers using proximity-based mobile device interactions, enterprise ", "pa_type": "patent", "url": "https://patents.google.com/patent/US12731184B2/en", "owner": "Bank of America Corporation", "id": "patent:US12731184B2"}, {"kind": "prior_art", "label": "FRAMEWORK AND METHOD FOR ACKNOWLEDGING MULTIPLE MESSAGES IN UWB COMMUNICATION AND RANGING SYSTEMS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20200355819A1/en", "owner": "Samsung Electronics Co., Ltd.", "id": "patent:US20200355819A1"}, {"kind": "prior_art", "label": "Integration of verification tokens with mobile communication devices", "pa_type": "patent", "url": "https://patents.google.com/patent/US12694390B2/en", "owner": "Visa International Service Association", "id": "patent:US12694390B2"}, {"kind": "prior_art", "label": "METHOD AND DEVICE FOR PAYMENT USING ULTRA-WIDEBAND", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260203741A1/en", "owner": "Samsung Electronics Co., Ltd.", "id": "patent:US20260203741A1"}, {"kind": "prior_art", "label": "MACHINE LEARNING FOR AUTHENTICATION BASED ON DEVICE PROXIMITY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260073380A1/en", "owner": "MASTERCARD INTERNATIONAL INCORPORATED", "id": "patent:US20260073380A1"}, {"kind": "idea", "label": "Latent-space equalisation bridge: exchanging scam-risk embeddings between independently trained models of banks, telcos and platforms without retraining or raw data", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Romance and investment scams are visible early on messaging platforms and telco networks, but the bank only sees the final transfer (e.g. 'Mum sent them \u00a3140,000'). Sharing raw conversations or call data is legally impossible, and participants will not co-train one shared model.", "mechanism": "Each participant keeps its own, independently trained risk encoder. Using a small set of consented anchor entities that appear across participants (known scam numbers, payees, domains, plus benign controls), the bridge fits a lightweight equaliser for each directed pair (A\u2192B): an orthogonal Procrustes or low-rank map with a nonlinear residual that sends A's latent vectors into B's latent space. At run time A sends only a latent vector for an entity (a phone number, payee account, URL), optionally with differential-privacy noise. B equalises it into its own space and feeds its existing classifier unchanged. The bridge monitors how well the anchors reconstruct; when drift passes a threshold after either side updates its model, it re-fits the equaliser automatically. In practice, a messaging platform's grooming-risk representation of the payee's contact reaches the bank's payment-risk model at the moment of transfer.", "novelty_pa": 0.2426, "id": "idea:A1-05"}, {"kind": "source", "label": "'Mum sent them \u00a3140,000': How to spot the signs a loved one is being scammed - BBC", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiXkFVX3lxTE1Vc1hkRzFtZW9IU3VoZENNMGJkOUZzV095WHAzUWZrNjVOck0wc2dJWTRZdExyQjlFRkFzejFDRWpKUUpySVhGdnVXS1VkWWE1WDdMXzJIRzk5bW51cGc?oc=5", "id": "news:b3420b55cc7d3f68"}, {"kind": "source", "label": "Wave-Domain Semantic Equalization Using a Practical Dynamic Metasurface Antenna with Strong Mutual Coupling", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.33729", "id": "arxiv:2609.33729"}, {"kind": "prior_art", "label": "Poisoning Agentic Alpha: Adversarial Vulnerabilities Across Roles and Architectures in Multi-Agent Trading Systems", "pa_type": "paper", "url": "https://arxiv.org/abs/2608.24069", "owner": "", "id": "arxiv:2608.24069"}, {"kind": "prior_art", "label": "Your Agent Says Yes: Interpreting Adversarial Market Behavior Beyond Individual Transactions", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.07675", "owner": "", "id": "arxiv:2609.07675"}, {"kind": "prior_art", "label": "Adversarial robustness of AI systems in financial infrastructure: An empirical study of evasion attacks and defensive training on the Adult Dataset", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/1949c31214db8f4e074e33a046a2f3466ae033f8", "owner": "", "id": "s2:1949c31214db8f4e074e33a046a2f3466ae033f8"}, {"kind": "prior_art", "label": "PixSim: a calibrated open-source simulator of instant-payment fraud, recovery and interdiction under analyst capacity constraints", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.30684", "owner": "", "id": "arxiv:2609.30684"}, {"kind": "prior_art", "label": "Anatomy of a Scam Call: What 10,000 real scam and spam calls reveal about how phone scammers operate", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/a024a306f7679b44b523e9c1e3aee0a869583031", "owner": "", "id": "arxiv:2608.24127"}, {"kind": "idea", "label": "Living QR: flicker-coded payment codes read by event-based vision sensors to defeat QR swaps, stickers and screenshot replay", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "QR payments dominate India and much of Asia, and QR tampering is a volume fraud: stickers pasted over merchant codes, screenshot replay, fake 'receive money' QRs. A static optical code carries no liveness, and dynamic codes that change every 30 s can still be photographed and relayed.", "mechanism": "The payee display renders a standard-looking QR, so ordinary cameras still work, but modulates a subset of modules with an imperceptible high-frequency ternary luminance flicker (+/0/\u2212, 0.5\u20132 kHz). The flicker carries a rolling nonce stream and a MAC bound to the payment request and merchant key. The payer device reads it with an event-based vision sensor (or a high-speed camera mode), which captures polarity events asynchronously and is not limited by frame rate. Verification requires the nonce to be current to within milliseconds and the MAC to match the QR payload. A printed sticker, photograph or screenshot has no flicker channel, and a relayed live stream adds measurable latency, so both fail. The same channel carries larger payloads such as a signed invoice or merchant certificate without dense codes.", "novelty_pa": 0.2515, "id": "idea:A1-06"}, {"kind": "source", "label": "Canada\u2019s Big Six Banks Jointly Explore Digital Deposits Network - Bloomberg.com", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMitAFBVV95cUxQRGc4RzRFbXlLNkRvS3hhX3hXTEZSX05RS2ZMQVJRSG5rTktscjVkY1I2dDYxTGVfNm92OXdmbndERXpHVzUtWVRvMmpLTm1yZC1wV1RwY2lubHBRLV9MWW9GYTNRRVNXQURyTHlIVFh6T3hQMjN3LUlCaHdHQUt2NUY5VmhwcnZLRkFlaGd5WTVPNXlDX3YxV1FGT0RCUEpocXg3WTk2VEdvODAwQ1VCYTBOSDQ?oc=5", "id": "news:b05d66bdce0aab7a"}, {"kind": "source", "label": "Ternary Visible Light Communication Using Event-Based Vision Sensors", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.36905", "id": "arxiv:2609.36905"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR IDENTIFYING COUNTERFEIT PRODUCTS USING LIVE VERIFICATION WITH UNIQUE, PRIVACY-PRESERVING, UNPREDICTABLE, AND TAMPERPROOF QR CODES INTEGRAT", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260268344A1/en", "owner": "SAFRI; Ali Asghar", "id": "patent:US20260268344A1"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR REAL-TIME VIDEO BROADCASTING, AUTHENTICATION, AND ELECTRONIC TRANSACTION PROCESSING IN A DISTRIBUTED NETWORK EVENT SETTING", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260141387A1/en", "owner": "Minina; Darya, Minin; Mikhail", "id": "patent:US20260141387A1"}, {"kind": "prior_art", "label": "Trusted QR code generation for financial transactions", "pa_type": "patent", "url": "https://patents.google.com/patent/US12705599B2/en", "owner": "Visa International Service Association", "id": "patent:US12705599B2"}, {"kind": "prior_art", "label": "Using QR Codes for Payment Card Fraud Detection", "pa_type": "paper", "url": "https://doi.org/10.3390/info17010039", "owner": "", "id": "doi:10.3390/info17010039"}, {"kind": "prior_art", "label": "EMAIL-BASED E-COMMERCE WITH QR CODE BARCODE, IMAGE RECOGNITION ALTERNATIVE PAYMENT METHOD AND BIOMETRICS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260289566A1/en", "owner": "SWOOP IP HOLDINGS LLC", "id": "patent:US20260289566A1"}, {"kind": "idea", "label": "Certified residual control of AI shopping agents: hardware-enforced bound on how far an agent's spending can drift from the user's mandate", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "On-device agentic commerce (chipmaker plus card-network partnerships) lets LLM agents pay. Mandates and limits are checked one transaction at a time, but prompt injection or hallucination can push many individually valid purchases that together drift far from what the user meant.", "mechanism": "The signed user mandate is compiled into a deterministic nominal policy, a planned spending trajectory per category over time. The LLM agent may only propose residual actions relative to that plan. A safety filter inside the device TEE / secure element projects each proposed residual onto the set that keeps a certified \u21132 (energy) bound on the cumulative deviation between actual and nominal trajectories. The bound comes from an offline stability certificate for the policy, as in residual learning on top of a certified controller. Only the projected action can request an agentic network token. The token carries an attestation of the certificate and the remaining deviation budget, so the issuer can verify compliance without seeing the prompt. Whatever the model outputs, total harm is capped by the certified budget.", "novelty_pa": 0.2146, "id": "idea:A1-07"}, {"kind": "source", "label": "[Snapdragon Summit] Qualcomm, Mastercard Announce Agentic Commerce Partnership - thelec.net", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiZ0FVX3lxTE9Qa25rX2V1MFZnNDBiVlBYcmxXUmVORVR1cnhIWkxzbWFTdHRZa2VQelZnV3B3R2tsSlJZVTV2d1pjM0tTaXR5Z2hPTGhncWhvZHUzSlJHMnYzNkFKanJLN0xNQnFmWDQ?oc=5", "id": "news:ecd7907644b315a6"}, {"kind": "source", "label": "Residual Learning-Based Control of Vehicle Platoons with $\\ell_2$ Stability Guarantees via Recurrent Equilibrium Network", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.33892", "id": "arxiv:2609.33892"}, {"kind": "prior_art", "label": "PACE: Policy-Attested Contract Execution for Safe AI Agents in Decentralized Finance", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/3b15e7651a4f0d2c6b2eb7adf6a1a658d8484e68", "owner": "", "id": "arxiv:2608.17220"}, {"kind": "prior_art", "label": "Beyond the Mandate: A Systematic Security Analysis of the Agent Payments Protocol (AP2)", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/41ebbd408ee914bb50a88053d671126855b50cf7", "owner": "", "id": "arxiv:2608.23858"}, {"kind": "prior_art", "label": "A Formal Analysis of Agent Payment Protocols", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/8740a3e9a12aa3eeb46a0f0b0e9bfa5b8350712c", "owner": "", "id": "arxiv:2609.00060"}, {"kind": "prior_art", "label": "SECURING AGENTIC COMMERCE THROUGH BEHAVIOR-AWARE FRAUD DETECTION AND CYBERSECURITY FOR TRUSTED AI-AGENT PAYMENT AUTHORIZATION", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/9703a43574a0193d6686c04ce4a4f38c00d28ccb", "owner": "", "id": "s2:9703a43574a0193d6686c04ce4a4f38c00d28ccb"}, {"kind": "prior_art", "label": "Runtime Authorization for Resources Acquired by AI Agents", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/4f49bc0f157c057391ce6b2ce363f2ed35572728", "owner": "", "id": "arxiv:2609.14744"}, {"kind": "idea", "label": "Body-area motion consensus: authorising wallet or tokenized-deposit payments only when co-worn earbuds, watch and phone agree they share one moving body", "arm": "A1", "run": "2026-09-30", "domain": "identity", "problem": "A phone can be stolen while unlocked, handed over under coercion, or operated by a 'helper'. Device-bound payment credentials then work for the wrong person. Biometric prompts add friction and are also coerced.", "mechanism": "At authorisation, the phone collects 2\u20134 s IMU windows from enrolled co-worn devices over authenticated BLE: earbud head IMU, watch, and smart insoles if present. A reliability-gated fusion model scores each stream's reliability, dropping biased, drifting or disconnected ones, and tests a body-kinematic consensus hypothesis: gait phase, head-trunk coupling and step timing must be consistent with one body. If consensus holds with enrolled wearables, step-up is skipped. If the phone moves but the wearables are stationary or out of sync (phone snatched, handed over, or operated by another person), the payment is limited, delayed, or sent for confirmation on the wearable.", "novelty_pa": 0.2254, "id": "idea:A1-08"}, {"kind": "source", "label": "Canada's Big Six Banks Partner to Explore Canadian-Dollar Tokenized Deposit Initiative - Moomoo", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiowFBVV95cUxPRDAzSVR2aGhyWnBMOHotek90R25FS2NyWncwZFlPc3VqdGxINHpSaFVxRUtTRDlGVWtqWjNkTUJjVThraExDMXJ1M1lpT1FDYkFaUXUtdmtlRHgzZkNmOE5Ya2Fob2hYM2hqTHhmckh6cTFOYzMwM003RnhIR09hNkQtUDc1VnoxNG1vZ1ZMdVJiTUIySVZDSTd4NUt5ZkJXVHUw?oc=5", "id": "news:2eebc5fc297e37db"}, {"kind": "source", "label": "Reliability-Gated Fusion of Consumer Head and Foot IMUs for Lower-Body 3D Pose", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.35764", "id": "arxiv:2609.35764"}, {"kind": "prior_art", "label": "Transaction Using A Mobile Device With An Accelerometer", "pa_type": "patent", "url": "https://patents.google.com/patent/US20110189981A1/en", "owner": "", "id": "patent:US20110189981A1"}, {"kind": "prior_art", "label": "Wearable Electronic Devices and Mobile Transactions and/or Actions", "pa_type": "patent", "url": "https://patents.google.com/patent/US20160063474A1/en", "owner": "Spencer, II; Carroll Alexis", "id": "patent:US20160063474A1"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR AUTHENTICATION AND PAYMENT WHILE WEARING A FACE COVERING", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250356355A1/en", "owner": "Mastercard International Incorporated", "id": "patent:US20250356355A1"}, {"kind": "prior_art", "label": "Apparatus and method for wireless secure payment and data transaction with biometric enrollment and authentication", "pa_type": "patent", "url": "https://patents.google.com/patent/US11017377B2/en", "owner": "Leung; Ka Wai Wayne", "id": "patent:US11017377B2"}, {"kind": "prior_art", "label": "ELECTRONIC DEVICE AND GESTURE-BASED PAYMENT METHOD USING SAME", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260127603A1/en", "owner": "Samsung Electronics Co., Ltd.", "id": "patent:US20260127603A1"}, {"kind": "idea", "label": "Threshold-calibrated decoy mule seeding: capturing laundering networks by pushing instrumented accounts past the network's own adoption threshold", "arm": "A1", "run": "2026-09-30", "domain": "regtech", "problem": "Laundering networks (one allegedly moved $6.9B through global banks) route around individual freezes. Closing accounts one by one never reaches the network's structure.", "mechanism": "Under law-enforcement authorisation, a bank consortium exposes instrumented decoy accounts to mule-recruitment channels (job-scam ads, recruiter channels). A threshold population model, adapted from gene-drive replacement dynamics where a trait spreads only after its release fraction crosses an unstable threshold, estimates the decoy share of the active mule pool above which recruiters' preferential reuse of 'reliable' accounts makes flows route predominantly through decoys. Decoys are engineered to be the most reliable: fast, never frozen, high limits. The optimiser schedules releases (count, timing, geography, persona mix) to cross the threshold at minimum cost. Past it, a growing share of laundered value passes through controlled settlement, exposing upstream and downstream nodes, and funds are held for recovery.", "novelty_pa": 0.2186, "id": "idea:A1-09"}, {"kind": "domain", "label": "regtech", "id": "domain:regtech"}, {"kind": "source", "label": "A7 Allegedly Laundered $6.9 Billion Through Global Banks - Fincrime Central", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMifkFVX3lxTE5ZOGhIWXBnYjFqZnp4eHAwbGlNQ3dNTmx4bWt4d3dZcUY4SWMxSUVTSkFaLV9Na3FTWWhwTFdzajlzNWJaTk5CV1JfTGVJZi0wRjE5Wm5MRUo5cDdJMUY1VmZOc29zTjhOOGJkNEE5R1F6Zy1oMjhqYS1LWjlDUQ?oc=5", "id": "news:8c125121870f8df5"}, {"kind": "source", "label": "Modeling Medea gene-drive population replacement: thresholds and release strategies", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.06687", "id": "arxiv:2609.06687"}, {"kind": "prior_art", "label": "A Comprehensive Review of Money Mule Networks and Financial Fraud Detection Techniques", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/9553c7f08cd59d661b917332ba3e388f1c48f2f9", "owner": "", "id": "s2:9553c7f08cd59d661b917332ba3e388f1c48f2f9"}, {"kind": "prior_art", "label": "An Interpretable Approach to Money Laundering Detection in Transaction Graphs using Pass-Through Templates", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/ee5334a50eb7765c9957d866b98152695f2c4881", "owner": "", "id": "arxiv:2609.20737"}, {"kind": "prior_art", "label": "Fraud\u2013AML Convergence: Integrating Fraud and AML Detection, Shared Typologies, and Unified Case Management.", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/15afa59581075e6a0fa82875875a9b92778a0333", "owner": "", "id": "s2:15afa59581075e6a0fa82875875a9b92778a0333"}, {"kind": "prior_art", "label": "Method, device, and system of detecting mule accounts and accounts used for money laundering", "pa_type": "patent", "url": "https://patents.google.com/patent/US12380455B2/en", "owner": "BIOCATCH LTD.", "id": "patent:US12380455B2"}, {"kind": "prior_art", "label": "Method, Device, and System of Detecting Mule Accounts and Accounts used for Money Laundering", "pa_type": "patent", "url": "https://patents.google.com/patent/US20240013225A1/en", "owner": "BIOCATCH LTD.", "id": "patent:US20240013225A1"}, {"kind": "idea", "label": "Scam-script phylogenetics: reconstructing the family tree of scam messages, calls and malicious apps to predict and pre-block the next variants", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Bank anti-scam systems (such as newly launched 'guardian' protections) react to each new lure after victims report it. Scam operators mutate templates constantly (brand swaps, lure swaps, new APK wrappers).", "mechanism": "Scam artefacts are collected from customer reports, telco and SMS gateways, call transcripts, phishing landing pages and APK static features, and embedded into aligned feature sequences. Lineage trees are reconstructed with quartet-based methods that reweight redundant quartets. These scale to millions of samples and tolerate missing features, which pairwise-distance clustering cannot. Ancestral-state reconstruction infers the template at each internal node. Mutation operators observed along branches (entity substitution, URL-shortener rotation, lure-theme shifts, permission-set drift) are learned per clade and applied forward to generate likely descendant variants. The system then pre-emptively deploys detection signatures and messaging-filter rules for those variants and attributes each new sample to an operator clade for coordinated takedown.", "novelty_pa": 0.2402, "id": "idea:A1-10"}, {"kind": "source", "label": "KBC Launches 'Guardian Angel' to Protect 4 Million Belgian Customers from Fraud - FF News", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMipAFBVV95cUxQZGRvdnRFYkU3eWMwOHBWX2pPYmxGbmtNRXZwRXdDLXlXWnpUVGRhTktVcnNwX2tqNkY5TVp5YVZQYmZBb2lWc2cwRTU3NFdNeDMtUzljc0QwLUdueHV4b25OLVYwamZFblJYajZXS1J6U1N0dVNRb3BiSjhzdWxLT0lKcGQxb0xxT3ZOQU53ZVg2MVE5OUQwVXpUdk5Qc3kyWll3ZQ?oc=5", "id": "news:6b938fbad2559306"}, {"kind": "source", "label": "BME-like Quartet Weights for Phylogenetic Trees", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.00614", "id": "arxiv:2609.00614"}, {"kind": "prior_art", "label": "A Corpus of Real Scam- and Spam-Call Conversations from an Active Voice-Agent Honeypot", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.29528", "owner": "", "id": "arxiv:2609.29528"}, {"kind": "prior_art", "label": "Lifting the Grey Curtain: Analyzing the Ecosystem of Android Scam Apps", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/fbd1210664008be37081c77b408906606b831f18", "owner": "", "id": "s2:fbd1210664008be37081c77b408906606b831f18"}, {"kind": "prior_art", "label": "A drift adaptive framework for detecting and tracking evolving anomalies in financial transaction streams", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/55dc1911b50b2f9bcad53ade973b94c4108a3153", "owner": "", "id": "s2:55dc1911b50b2f9bcad53ade973b94c4108a3153"}, {"kind": "prior_art", "label": "Graph construction in QUBO-based recursive phylogenetic tree reconstruction", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.16640", "owner": "", "id": "arxiv:2609.16640"}, {"kind": "idea", "label": "Constraint-aware factor-graph estimation of mobile device compromise for banking apps", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Malicious apps (fake hospital-appointment apps, adult-content lures) empty accounts by abusing accessibility services, overlays and SMS access. Banking SDK signals are sparse, noisy and often missing, so rule engines misfire both ways.", "mechanism": "The banking SDK observes a sparse set of signals: accessibility-service enablement and event rates, overlay-window presence, notification-listener or SMS-read capability, screen-share state, input-event timing, installed-package risk and OS patch level. A factor graph links hidden compromise-state variables (overlay attack, SMS interception, remote control, benign) to these observations. Hard factors encode OS permission logic, for example that SMS interception is impossible without READ_SMS or notification access, and overlays require SYSTEM_ALERT_WINDOW. Soft factors are learned likelihoods. Neural message passing with hard-constraint projection gives calibrated posteriors even when most observations are missing. These posteriors gate specific flows: SMS-OTP flows are disabled when P(SMS interception) is high, and payee addition when P(remote control) is high.", "novelty_pa": 0.2315, "id": "idea:A1-11"}, {"kind": "source", "label": "Bank accounts emptied in attempt to watch adult content: Govt warns users against these apps; check the lis... - Bhaskar", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiuwFBVV95cUxQcDN4WTd3dEVMRlhnQmlqYnZmOURtcE1QMHFxS3dKYVItTzdUV3JnaUliMUFvVXFmWjVGVGhDNFZuczk0Rndxa1JKX1VkS3UxQzVqUnVNc3pqdzdsRy1RQnVSSFpOeFZaVXFXdTI5LTJmeXpELWhzdXBhdUh0LWxORWVqdWFCcDg0SVk2UmFtLUs4ZVNveDVWZnRKM09ZTk5Sb3c1UHBGT0VOcE5JNGc1UGp1bV91R1dNQkFn0gHAAUFVX3lxTE1JU3FPaUlQdWRUTGFaaFBWR0Z4aUJtVnpMU2I1MnZ4LVU1UWhfU2ZIYmtQbTFzSlhPdUxwNi1QTG9WUUY2YXBoWGRCT3RZNjZKQzhpcnZHVWdzNUQ3NmtXT1NTNUlOdzNLMk4teEJkTXlfQlQ1VFVGY3hZY1R6aldRUFRmODVIRXQwTG40TmxtSUtXd01zZklLak8xakhqcTVEakR1WDF2ek1FODBNR1VLVHpIMDZpS2hVek9QMXZDNQ?oc=5", "id": "news:4c3e57e9cdf492a9"}, {"kind": "source", "label": "Hard-Constrained Probabilistic Factor Graph Neural Network for Distribution System State Estimation under Non-Gaussian U", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.35246", "id": "arxiv:2609.35246"}, {"kind": "prior_art", "label": "BankGuard-CGR: A Conformal Graph-Rule Framework for Fraud and Anti-Money-Laundering Detection in Banking Payment Systems", "pa_type": "paper", "url": "https://doi.org/10.2139/ssrn.7478298", "owner": "", "id": "doi:10.2139/ssrn.7478298"}, {"kind": "prior_art", "label": "Cyber-Financial Contagion: Modeling the Propagation of an AI Vendor Compromise Through the Banking System", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.10350", "owner": "", "id": "arxiv:2609.10350"}, {"kind": "prior_art", "label": "AI-Driven Fraud Detection in IoT-Enabled Payment Ecosystems: Challenges, Hybrid Edge-Cloud Framework, and Emerging Trends", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/b66446022276f3dc7f8e20d38a818e47cc97a720", "owner": "", "id": "s2:b66446022276f3dc7f8e20d38a818e47cc97a720"}, {"kind": "prior_art", "label": "FLEXIBLE CREDENTIAL ENABLED PUSH NOTIFICATIONS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260260239A1/en", "owner": "Wells Fargo Bank, N.A.", "id": "patent:US20260260239A1"}, {"kind": "prior_art", "label": "Real-Time Fraud Detection in Mobile and UPI-Based Payment Systems Using AI", "pa_type": "paper", "url": "https://doi.org/10.71443/9789349552005-17", "owner": "", "id": "doi:10.71443/9789349552005-17"}, {"kind": "idea", "label": "Channel-watermarked OTPs with honey-session diversion: proving SMS interception and harvesting mule accounts instead of just blocking", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Fake apps steal SMS OTPs. Blocking a suspicious login tips the attacker off, and the bank learns nothing about where the money was going.", "mechanism": "Each authentication challenge is issued with a different code per delivery channel (SMS, push, email, voice), all valid for the same session. The code that comes back reveals which channel delivered it. If the SMS-channel code is submitted from a device other than the bound device, or from a known phishing relay, SMS interception is proven. The session is then diverted into a high-fidelity honey session: a sandboxed copy of the account with synthetic balances, where the attacker's actions run against a shadow ledger. Beneficiary accounts they add, device fingerprints and cash-out paths are harvested and shared with the mule-intelligence network, and the real account is locked quietly. In parallel, speculative pre-execution computes the risk of the pending transaction while the user is still entering the code, so honest users see no added latency.", "novelty_pa": 0.2317, "id": "idea:A1-12"}, {"kind": "source", "label": "Keralam Police warn of fake hospital appointment apps used in financial fraud - ThePrint", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMisgFBVV95cUxNQlN0RC03dmRxMUFOdGVqOWJORDR3TTNFZmNSa2t0ci1GcEF3OS1wN0FZSElCS1h6QnJyZlRMMVprLVkwS09mY25fOTBBd2ZOSmhaUUEyS1ZYdVVuX0xLbkZ3MEFtSElpYzRIXzFfc3NXQWlkem5xN0t4TTdRU29rUHJGcjEyR2hfaGdQV1YyS2VzczlOT295LTN0THBfVVJydld0dC16QU01dmdXZ1NuU3Vn0gG3AUFVX3lxTE96c0NBWTNMUkk4T0psNkYxdW9rTmx6SFpsSVZYSXRKeDZqb19kN2liZGNfT0F5T1Y3WXViRjB2ZkdQcm9wQzJENUc2RnV0UjFCWjZQVFBJOUVrSVE2SEVuQkM4WExPMkdmTWFBdkR1ek1qRkhRTDJVTnB5MlV3WHRkWHQ5OHNCSUJEbXI1X2NZRjRoSVpaV09qOWNiTEtRZ2VZQXBmLWo1TzdMX2xqdGpXT1BfcmFkTQ?oc=5", "id": "news:3c4a723e5216b0b6"}, {"kind": "source", "label": "Spexis: Speculative Lookahead Scheduling for LLM Inference", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.34370", "id": "arxiv:2609.34370"}, {"kind": "prior_art", "label": "The Tragedy of Convenience: Cascading User-Data Leakage from SMS-Delivered URLs", "pa_type": "paper", "url": "https://arxiv.org/abs/2601.09232", "owner": "", "id": "arxiv:2601.09232"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR AI-POWERED SMS MIRRORING WITH SENSITIVE DATA MASKING AND SESSION RECOVERY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250310770A1/en", "owner": "CELLIGENCE INTERNATIONAL LLC", "id": "patent:US20250310770A1"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR SECURE SMS-CHAT MIRRORING AND SESSION-RESUMABLE WEB INTERACTION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250301326A1/en", "owner": "CELLIGENCE INTERNATIONAL LLC", "id": "patent:US20250301326A1"}, {"kind": "idea", "label": "Robust MPC ledger-convergence controller for sponsor-bank / fintech (BaaS) omnibus accounts", "arm": "A1", "run": "2026-09-30", "domain": "regtech", "problem": "After Synapse, regulators are resetting guidance. The core failure was a divergence between fintech sub-ledgers and the bank's FBO (for-benefit-of) omnibus balance that nobody saw until it was too large to close.", "mechanism": "The system models the gap between the omnibus balance and the sum of end-user sub-ledger balances as a dynamical state. Disturbances (pending card settlements, ACH returns, chargebacks, timing mismatches) are bounded by learned envelopes. A robust variable-horizon model-predictive controller recomputes funding transfers, holds and payout throttles every few minutes so that the gap 'lands' on a moving target: zero at each settlement cut-off event, whose timing moves. It keeps a guaranteed tube around the planned trajectory. Each sub-ledger update must carry a Merkle inclusion proof, so the controller's state is verifiable by the bank. If the MPC becomes infeasible, meaning the gap cannot be closed by the next cut-off under worst-case disturbances, the system raises a pre-shortfall alert days before a Synapse-style hole appears.", "novelty_pa": 0.2225, "id": "idea:A1-13"}, {"kind": "source", "label": "Regulators Move To Rescind Post-Synapse Risk Guidance, Lay Groundwork For Fintech Standards", "src_kind": "news", "url": "https://fintechbusinessweekly.substack.com/p/regulators-move-to-rescind-post-synapse", "id": "news:98d170fad608d39b"}, {"kind": "source", "label": "Robust Variable-Horizon MPC for Landing a Multirotor UAV on a Moving Platform", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.34574", "id": "arxiv:2609.34574"}, {"kind": "prior_art", "label": "On Control of Drawdown: Robust Invariance and Optimality", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.23272", "owner": "", "id": "arxiv:2609.23272"}, {"kind": "prior_art", "label": "Systemic Runs and the Dimension of Financial Fragility", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/a85d96b7f8e7e24a51bb766b5ed9ced889866321", "owner": "", "id": "s2:a85d96b7f8e7e24a51bb766b5ed9ced889866321"}, {"kind": "prior_art", "label": "Bayesian Confidence Recalibration and Research-Equilibrium Criticality: Temporal Support in Robust Portfolios", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.03741", "owner": "", "id": "arxiv:2609.03741"}, {"kind": "prior_art", "label": "CAST: A Cross-Asset State-Space Trading System for Drawdown Control in Stock Markets", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.14205", "owner": "", "id": "arxiv:2609.14205"}, {"kind": "idea", "label": "Grid-forming liquidity buffer for DLT-to-RTGS settlement bridges (droop-controlled central bank money injection for atomic-settlement bursts)", "arm": "A1", "run": "2026-09-30", "domain": "treasury", "problem": "Central banks now settle tokenised securities through DLT-RTGS bridges (e.g. the ECB's Pontes). Atomic DvP settlement creates step-like intraday liquidity demands that can gridlock participants.", "mechanism": "A buffer agent at the bridge holds pre-positioned central-bank-money tokens and acts like a grid-forming inverter. It sets the reference intraday liquidity 'frequency', the internal price of immediate liquidity, and responds to the rate of change of pending DvP obligations with droop control: each participant's pre-agreed droop coefficient sets how much liquidity it automatically draws or supplies as the frequency deviates. Current-limiting caps per participant stop any single node from destabilising the network. A network energy function with provable dissipation certifies that the system returns to equilibrium after any bounded burst. Injections are collateralised automatically from pledged tokenised assets on the DLT side.", "novelty_pa": 0.2186, "id": "idea:A1-14"}, {"kind": "domain", "label": "treasury", "id": "domain:treasury"}, {"kind": "source", "label": "ECB to invest part of own funds in tokenised securities, with settlement via Pontes", "src_kind": "news", "url": "https://www.ecb.europa.eu//press/pr/date/2026/html/ecb.pr260921_1~5a011ecbea.en.html", "id": "news:1517bc72795f1a1b"}, {"kind": "source", "label": "Grid-Forming E-STATCOMs for Stable Integration of Large-Scale Data Centers: Modeling and Control", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.33553", "id": "arxiv:2609.33553"}, {"kind": "prior_art", "label": "Managing settlement risks in tokenised money: Applying the Principles for Financial Market Infrastructures to digital assets", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/aa0a79f14c49b5124b65ec4668f1ff4bd205ea50", "owner": "", "id": "s2:aa0a79f14c49b5124b65ec4668f1ff4bd205ea50"}, {"kind": "prior_art", "label": "Tokenisation and the reconfiguration of capital market infrastructure : T+0 settlement, mathematical trust, and multi-currency yield curves", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/3f30aee1571ec23f611791cf43070dc64ca410a3", "owner": "", "id": "s2:3f30aee1571ec23f611791cf43070dc64ca410a3"}, {"kind": "prior_art", "label": "DYNAMIC GRID CURVES FOR GASLESS DECENTRALIZED TOKEN SWAPS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260004352A1/en", "owner": "1inch Limited", "id": "patent:US20260004352A1"}, {"kind": "prior_art", "label": "Game Theoretic Liquidity Provisioning in Concentrated Liquidity Market Makers", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/2b4d948c918a7a0f41bb899fe7650cd79de171d1", "owner": "", "id": "arxiv:2411.10399"}, {"kind": "idea", "label": "Forecast-sized offline mandates for machine and agent payments using physics-informed connectivity forecasts", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "Machine and agent payments (network 'Agent Pay for Machines', first bank agentic transactions) assume connectivity. Vehicles, drones, ships and rural IoT go offline. Over-sized offline allowances create double-spend and fraud exposure; under-sized ones strand the machine.", "mechanism": "Before a mission or route, the issuer predicts the timing and length of connectivity gaps along the agent's planned path. The forecast is built from public satellite-constellation geometry, weather attenuation, cellular coverage maps and routing data, using a physics-informed link-state forecaster. The issuer then provisions time-boxed offline credentials (pre-authorised token bundles or offline CBDC value) sized to the expected consumption during each forecast gap plus a risk margin. Each credential expires at the forecast reconnection time plus tolerance and is valid only within the forecast geographic corridor. On reconnection, spend is reconciled and the forecaster is updated with the realised gaps.", "novelty_pa": 0.2489, "id": "idea:A1-15"}, {"kind": "source", "label": "Mastercard Helps Danske Bank With Denmark-First Agentic Transaction - PYMNTS.com", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMivgFBVV95cUxPSXFOcVBwdXA5UTJQampuTERNbnROUVVxU1lENUM4VFgtUE5MTVlKSVU4elg2TG11MXhjUU5VWWd2M0lqbXRkNm83M2JQQW02WUZ0cFdjaG45bDJpQ0JBMmxhMGU1cm9RZGtQc2hzdFFIa2hLT1NPdExFdGxLYkxBY3B5b2g2eUVYZkd5MjhRVkRZWTQxQWJ6Zk1wTEtlSE5qNDBld0UwbDQtQ1h5dUU1cVdTM1lWeTVTb1ZBRDVn?oc=5", "id": "news:fefcaf910263218b"}, {"kind": "prior_art", "label": "Reading the Sky to Forecast the Ground: Physics-Informed Link-State Forecasting for LEO Networks at Any Location", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.26696", "pa_type": "paper", "owner": "", "id": "arxiv:2609.26696"}, {"kind": "prior_art", "label": "402Pilot: An x402 Decision Layer for Autonomous Agent Micropayments", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/5b01c911d4704cf44bb699f1a6d561838a47610c", "owner": "", "id": "arxiv:2608.01341"}, {"kind": "prior_art", "label": "CausalLoss-Fin: Attributing Financial-Agent Loss to Decisions and Infrastructure Faults", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/9f32b5e78a765435d5bda087eaff59211ff728f4", "owner": "", "id": "arxiv:2609.25960"}, {"kind": "prior_art", "label": "Agentic Payments Observatory: A Unified Framework for Linking Smart Contracts, Agent Identity, Anomaly Detection and Policy Breaches", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/35f675fa5cf991887bd1890340e10de87b3b565d", "owner": "", "id": "s2:35f675fa5cf991887bd1890340e10de87b3b565d"}, {"kind": "idea", "label": "Reachability-certified pre-emptive holds: intercepting stolen funds ahead of the money instead of chasing hops", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Cyber-fraud reporting systems (India's 1930 helpline and CFCFRMS, UK APP reimbursement) place liens hop by hop after the money has moved. Mule layering outruns them within minutes, and the 'golden hour' is lost.", "mechanism": "When fraud is reported, the system models the stolen funds as an adversary with bounded manoeuvring capability on the inter-bank payment graph. The bounds are per-rail latency, per-account velocity and limits, new-payee cooling periods, and cash-out points (ATMs, crypto on-ramps, merchant cash-back). From these it computes the forward reachable set of accounts over time. It then solves for the minimum set of accounts to place under short, auto-expiring holds now, such that every reachable cash-out path is covered before the funds could arrive: a capture certificate, analogous to robust safety certificates against manoeuvring obstacles. Hold requests are signed, scoped and time-limited, and are issued to participating banks. Each bank solves its part through a distributed ADMM formulation, so no raw transaction data leaves the bank. Unused holds release automatically.", "novelty_pa": 0.2434, "id": "idea:A1-16"}, {"kind": "source", "label": "1930 helpline strengthened for cyber fraud: SSP Kichloo - Brighter Kashmir", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiigFBVV95cUxPWk9GVjBYczlWb0FqeXF5TmI1bFBDUWdMRHdRWjBhUjRvMFdDMTR3dWFwWVpvTS01U1llbUNOSWJLaVhid01jd0VlZUt5MXJJTFBCcV9SSnBvVTZ4dE5SMEMwa3BQRExHeUw3NThZbFYtWVZnbS1RWXRFTkN3bGl4aUJZeWFrTm55UGc?oc=5", "id": "news:f657a56c4007da96"}, {"kind": "source", "label": "Adversarially Robust Geometric Safety Certificates for Nonholonomic Robots Against Maneuvering Obstacles", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.37126", "id": "arxiv:2609.37126"}, {"kind": "prior_art", "label": "Adaptive Graph-Based Risk Scoring for Real-Time Instant Payment Systems", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/e3db443b55fbb1960ad2a9005fbe397ff9273a07", "owner": "", "id": "s2:e3db443b55fbb1960ad2a9005fbe397ff9273a07"}, {"kind": "prior_art", "label": "Instant Fraud Detection Gateway for Secure Digital Transactions", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/23c7490b635031b1fc5fd493192e786acdeaee2a", "owner": "", "id": "s2:23c7490b635031b1fc5fd493192e786acdeaee2a"}, {"kind": "idea", "label": "Proportionality-bounded mass enforcement: compensatory review allocation before automated fraud actions hit hundreds of thousands of people", "arm": "A1", "run": "2026-09-30", "domain": "regtech", "problem": "Mass automated fraud determinations (760,000 insurance cancellations; people jailed after AI flags) concentrate false positives on particular segments. The error accumulates across segments in the same way apportionment rounding bias accumulates across districts.", "mechanism": "Before a batch of automated adverse actions is executed, the system computes for each segment (region, age band, channel, language) the gap between its share of actions and its share of evidence-weighted fraud likelihood. It uses probabilistic seat-vote discrepancy bounds to predict the accumulated disproportionality across all segments. It then allocates a fixed number of 'compensatory' human-review slots or deferred-action slots to over-actioned segments, so that the maximum disproportionality stays under a configured bound, and executes the rest. A signed proportionality certificate is logged for audit and appeal.", "novelty_pa": 0.2407, "id": "idea:A1-17"}, {"kind": "source", "label": "Trump administration cancels insurance for 760,000, alleging fraud - upi", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMilAFBVV95cUxQbFBlRkI3VXlOUzAtS3hNcXZjQ2hJVEtSZmFWc1czRDkzVjRhb1RhQ2hLZTA0d2RReGRwaHVYZVN5UndJeXNSU2RPeVlyRFhqdUFidzVUb0FXMVZDZmhOaHZ4WUdvWmpjUEw2eDVEWVlYZXNHOVNkcE5lMmZVZnBfTlRrTnRFWWlDM08xVlVKYkYwbzJE0gGaAUFVX3lxTE5DOTczdnEzS2pVRHpCSUVQZ1R4UEE5RXJYX2Q2QXhwajdLRkYxdFdpNk5PcHBjdVhjVGlRNlRNbXNGNDlOal9VVVJrTEtGSG1pSkprZUtHQnJINnBobEc0UDRjRUxFZm5mTWFscXJrQ24yaGs1ekVzSkNMU1dZaTgwQWFOWTdLa2Fqd2FuVWdZXzE2emlYRFB2Smc?oc=5", "id": "news:06c301528ee43296"}, {"kind": "prior_art", "label": "Ensuring proportionality: a logical model for compensatory seats added to multi-member constituencies", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.18710", "pa_type": "paper", "owner": "", "id": "arxiv:2609.18710"}, {"kind": "prior_art", "label": "Auditable Credit Risk Intelligence for the U.S. Financial System: A Scalable Explainable-AI Framework Reconciling Predictive Performance with ECOA, FCRA, and Mo", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/cec476b59809bdb02ace7de065687840ecf453c2", "owner": "", "id": "s2:cec476b59809bdb02ace7de065687840ecf453c2"}, {"kind": "prior_art", "label": "AI-enabled fraud analysis", "pa_type": "patent", "url": "https://patents.google.com/patent/US12743707B2/en", "owner": "KPMG International Services Ltd", "id": "patent:US12743707B2"}, {"kind": "prior_art", "label": "Causal Evidentiary Governance for High-Risk Machine Learning Systems", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/d1802330129e87c4b4b26df3fefb12479a0d247a", "owner": "", "id": "arxiv:2609.01040"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR REAL-TIME ONLINE REVIEW FRAUD DETECTION USING FRAUD-AWARE SELECTIVE ATTENTION WITH MULTI-TIER VERIFICATION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260212362A1/en", "owner": "LEVENTOGLU; \u00d6NDER", "id": "patent:US20260212362A1"}, {"kind": "idea", "label": "Trust-farming-resistant payee reputation: semi-monotone graph centrality that turns scammers' bait payments into a risk signal", "arm": "A1", "run": "2026-09-30", "domain": "fraud", "problem": "Romance and investment scammers 'groom' victims with small returns and route micro-payments through the payee to build reputation. Graph-based payee-trust scores rise with every added edge, so the grooming makes the scam payee look safer.", "mechanism": "The payee-reputation engine uses a centrality measure constrained to be semi-monotone. Edges from clusters with synchronised creation, reciprocal micro-flows or shared devices contribute sub-linearly. Reverse 'bait' edges, where the prospective victim previously received small sums from the payee, are classified as trust-farming, and their contribution is inverted into risk. The trigger at payment time is: the payer received \u22651 small inbound payment from this payee within N weeks, the outbound amount is much larger, and the payee's recent centrality gain comes mostly from bait-like edges. This trigger produces friction and a tailored warning.", "novelty_pa": 0.234, "id": "idea:A1-18"}, {"kind": "prior_art", "label": "Semi-Monotonicity for Spectral Centrality Measures", "src_kind": "paper", "url": "https://arxiv.org/abs/2609.24683", "pa_type": "paper", "owner": "", "id": "arxiv:2609.24683"}, {"kind": "prior_art", "label": "AI-Based Fraud Detection and Customer Protection in Online Markets: Balancing Transaction Security and Enhancing Digital Payment Adoption", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/7d04d5323849580b64407a7bce6fc62362ad572f", "owner": "", "id": "s2:7d04d5323849580b64407a7bce6fc62362ad572f"}, {"kind": "prior_art", "label": "Real-time Payment Fraud Detection Using Graph Neural Intelligence", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/e8e3b39f649540ba175c59de332c446644854c33", "owner": "", "id": "s2:e8e3b39f649540ba175c59de332c446644854c33"}, {"kind": "idea", "label": "Principal-intent factor graph with evidentiary bundle for agent-initiated payments and dispute resolution", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "When an AI agent buys the wrong item or books the wrong dates, liability between merchant, issuer and agent platform is unresolved. There is no verifiable record of what the user actually intended.", "mechanism": "For each agent-initiated payment, a factor graph over hidden intent variables (item class, budget, deadline, merchant constraints, substitutes allowed) combines noisy observations: the signed natural-language mandate, parsed into constraints; the user's historical approvals and rejections; context such as calendar and location; and the agent's proposed cart. Hard factors enforce explicit mandate constraints and soft factors are learned. The posterior probability that the proposed purchase lies within intent is computed. Low-probability purchases are routed to the user for confirmation. Every payment carries a signed evidentiary bundle with the posterior, the dominant factors and the hashes of the inputs, written in a form an auditor can check without trusting the agent platform's own logs. Dispute adjudication uses this bundle to allocate liability.", "novelty_pa": 0.2211, "id": "idea:A1-19"}, {"kind": "prior_art", "label": "When AI Agents Pay: A Rollback Governance Framework for Fraud and Execution Failure in Agentic Stablecoin Payments", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/d127703cb86e99b151d2af0b0cde9d7397a4cf25", "owner": "", "id": "s2:d127703cb86e99b151d2af0b0cde9d7397a4cf25"}, {"kind": "prior_art", "label": "Offline-Verifiable Accountability for Cross-Organization Agent Messaging: A Preserved Evidence-Bundle Approach", "pa_type": "paper", "url": "https://arxiv.org/abs/2608.28542", "owner": "", "id": "arxiv:2608.28542"}, {"kind": "prior_art", "label": "EG-MAP: Evidence-Grounded Multi-Agent Smart Contract Auditing", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/ad87bb98ed914f1f562a7fc107a0c8eccd3b998c", "owner": "", "id": "s2:ad87bb98ed914f1f562a7fc107a0c8eccd3b998c"}, {"kind": "idea", "label": "Payday-landing controller for earned wage access: advance sizing with a robust no-cycle guarantee", "arm": "A1", "run": "2026-09-30", "domain": "credit", "problem": "Earned wage access (EWA) products are being sued as disguised high-cost loans because users fall into repeat-advance cycles.", "mechanism": "Before offering an advance, the provider runs a robust variable-horizon MPC over the worker's projected balance until payday. Inflows are the remaining earned wages, and outflows are known bills, typical spend and bounded disturbances. The controller computes the largest advance and the fee-free timing that guarantee the balance 'lands' non-negative at payday after repayment, with no second advance needed under worst-case disturbances. The feasibility certificate is stored per advance as ability-to-repay evidence.", "novelty_pa": 0.2538, "id": "idea:A1-20"}, {"kind": "domain", "label": "credit", "id": "domain:credit"}, {"kind": "source", "label": "Colorado Sues EarnIn, Alleging Its \u201cEarned Wage Access\u201d Product Is Really a High-Cost Loan - Consumer Finance Monitor", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMi1AFBVV95cUxQN21MVHV4NmVNbDdkdWZmQUZxLXRUT2I2U3dKeWQwaG5vbzFhcXVoc1FDVUJwd3lxdGZWVVYxTGhYTXpFY1lfZ2U3MUtBS3B6Qnp5bEFTMzJvV2czazBWdVZpbjRMN2lYY29GOVpUZ2xoM3VIVXZESHFpYlZmQVE2N1pucHJBUlhDWk1MTmpIY3Z4SVpuUGdXVHpwRl84SDY1N3hxMmI0LWplR201b3R6ZzF3NHo0TGhuanJQa1FWc28wbmF0b2Q3N29nMV9ha3lrMkMxWQ?oc=5", "id": "news:d139d55e1e4a00fc"}, {"kind": "prior_art", "label": "EARNED COMPENSATION ACCESS SYSTEM WITH INTERNAL AND EXTERNAL FUNDING OPTIONS FOR COMPENSATION PAYMENT BEFORE PAYDAY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250259233A1/en", "owner": "Alturki; Sultan Abdulaziz", "id": "patent:US20250259233A1"}, {"kind": "prior_art", "label": "METHOD AND SYSTEM FOR PROVIDING JUST IN TIME ACCESS TO EARNED BUT UNPAID INCOME AND PAYMENT SERVICES", "pa_type": "patent", "url": "https://patents.google.com/patent/US20160086261A1/en", "owner": "PAYACTIV Inc.", "id": "patent:US20160086261A1"}, {"kind": "prior_art", "label": "System and method of intra-cycle payment of accrued employee wages", "pa_type": "patent", "url": "https://patents.google.com/patent/US8751338B2/en", "owner": "Dombroski; Frank P., Lockhart; John", "id": "patent:US8751338B2"}, {"kind": "idea", "label": "Crowd-relayed settlement of offline payments via delay-tolerant store-carry-forward routing", "arm": "A1", "run": "2026-09-30", "domain": "payments", "problem": "Offline digital payments (offline CBDC, UPI Lite-style wallets
