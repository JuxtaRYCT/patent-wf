ies in Homabay County, Kenya", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/b630ce9320b5a58ccf0111148f5843f9adf0fb85", "owner": "", "id": "s2:b630ce9320b5a58ccf0111148f5843f9adf0fb85"}, {"kind": "prior_art", "label": "On the dynamics of credit history and social interaction features, and their impact on creditworthiness assessment performance", "pa_type": "paper", "url": "https://arxiv.org/abs/2204.06122", "owner": "", "id": "arxiv:2204.06122"}, {"kind": "idea", "label": "RTGS gridlock resolution by queue reordering", "arm": "A2a", "run": "2026-09-30", "domain": "", "problem": "Intraday liquidity gridlock.", "mechanism": "Optimise payment queue ordering to minimise liquidity needs.", "novelty_pa": 0.3145, "id": "idea:A2a-29"}, {"kind": "prior_art", "label": "Liquidity Provision and Rebate Design in Option Markets", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.26606", "owner": "", "id": "arxiv:2609.26606"}, {"kind": "prior_art", "label": "Low latency regulation of distributed transaction processing in accordance with centralized demand-based dynamically reallocated limits", "pa_type": "patent", "url": "https://patents.google.com/patent/US12749115B2/en", "owner": "Chicago Mercantile Exchange Inc.", "id": "patent:US12749115B2"}, {"kind": "idea", "label": "Pre-emptive chargeback prediction", "arm": "A2a", "run": "2026-09-30", "domain": "", "problem": "Chargebacks cost merchants.", "mechanism": "Predict chargeback probability at authorisation and offer proactive refund.", "novelty_pa": 0.2703, "id": "idea:A2a-30"}, {"kind": "prior_art", "label": "Systems and methods for optimizing electronic refund transactions for detected fraudulent transactions", "pa_type": "patent", "url": "https://patents.google.com/patent/US11790367B1/en", "owner": "Worldpay, LLC", "id": "patent:US11790367B1"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR OPTIMIZING ELECTRONIC REFUND TRANSACTIONS FOR DETECTED FRAUDULENT TRANSACTIONS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250384446A1/en", "owner": "Worldpay, LLC", "id": "patent:US20250384446A1"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR OPTIMIZING ELECTRONIC REFUND TRANSACTIONS FOR DETECTED FRAUDULENT TRANSACTIONS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250384444A1/en", "owner": "Worldpay, LLC", "id": "patent:US20250384444A1"}, {"kind": "prior_art", "label": "Systems and methods for optimizing electronic refund transactions for detected fraudulent transactions", "pa_type": "patent", "url": "https://patents.google.com/patent/US12406262B2/en", "owner": "Worldpay, LLC", "id": "patent:US12406262B2"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR OPTIMIZING ELECTRONIC REFUND TRANSACTIONS FOR DETECTED FRAUDULENT TRANSACTIONS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20230351399A1/en", "owner": "Worldpay, LLC", "id": "patent:US20230351399A1"}, {"kind": "idea", "label": "Unpredictable-quorum confirmation: bank-drawn random co-approvers contacted on bank-initiated channels for out-of-topology treasury instructions", "arm": "A2b", "run": "2026-09-30", "domain": "fraud", "problem": "A cloned executive voice plus a fake WhatsApp thread moved \u20ac95M overseas. Attackers script the impersonation of one or two known approvers in advance.", "mechanism": "For each corporate client the bank learns the instruction topology: who instructs, through which channel, in what approval order, and for which beneficiary classes and geographies. Any instruction whose path through this graph is new (for example a first overseas beneficiary requested by voice or messaging, or an approver skipping their usual channel) is held for a quorum. At confirmation time the bank draws k co-approvers at random from the client's authorised signatory list using a verifiable random function. It contacts them only through bank-initiated channels on enrolled devices (in-app push with passkey signature), never through the channel the instruction came in on. The attacker cannot know in advance whom else to impersonate, and has to compromise several devices in real time. The VRF output is logged so the selection can be audited.", "novelty_pa": 0.2657, "id": "idea:A2b-01"}, {"kind": "theme", "label": "T14", "id": "theme:2026-09-30:T14"}, {"kind": "prior_art", "label": "Techniques for cosigning blockchain transactions", "pa_type": "patent", "url": "https://patents.google.com/patent/US12682339B1/en", "owner": "Blockaid LTD", "id": "patent:US12682339B1"}, {"kind": "prior_art", "label": "Bank Run, Interrupted: Modeling Deposit Withdrawals with Generative AI", "pa_type": "paper", "url": "https://doi.org/10.1287/mnsc.2024.06807", "owner": "", "id": "doi:10.1287/mnsc.2024.06807"}, {"kind": "prior_art", "label": "Bank Run, Interrupted: Modeling Deposit Withdrawals with Generative AI", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/001e949c72cd466cb4680c50c06527b3c707744f", "owner": "", "id": "s2:001e949c72cd466cb4680c50c06527b3c707744f"}, {"kind": "prior_art", "label": "Cryptocurrency wallet with risk attribution", "pa_type": "patent", "url": "https://patents.google.com/patent/US12731148B2/en", "owner": "MASTERCARD INTERNATIONAL INCORPORATED", "id": "patent:US12731148B2"}, {"kind": "idea", "label": "Synthesis-toolkit fingerprint exchange: banks share model-attribution fingerprints of voice clones used in attacks, not voiceprints of customers", "arm": "A2b", "run": "2026-09-30", "domain": "fraud", "problem": "The same criminal voice-cloning toolkits hit bank after bank, but each bank's deepfake detector learns on its own.", "mechanism": "When a call is confirmed as a synthetic-voice attack, the bank extracts a model-attribution fingerprint: residual spectral artefacts, vocoder phase signatures and prosody-generation traces that identify the generation pipeline rather than the imitated speaker. It hashes these into locality-sensitive sketches and publishes them to a consortium index. Member banks query live calls against the index in real time. A match means the call was generated with a toolkit already seen in fraud, even if it imitates a different person. Only sketches of attacker artefacts are shared; no customer voiceprints are, which keeps it outside biometric-data restrictions.", "novelty_pa": 0.1765, "id": "idea:A2b-02"}, {"kind": "prior_art", "label": "Anti-Spoofing Evaluation Benchmark and Layered Defense Strategy for In-Cabin Voiceprint Payment under Voice Cloning Attacks", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/aa69292bca52bb0b0c60ba9ecd21a78a413f10cb", "owner": "", "id": "s2:aa69292bca52bb0b0c60ba9ecd21a78a413f10cb"}, {"kind": "prior_art", "label": "Audio Deepfake Detection by Using Machine and Deep Learning", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/5998b2c580560463eabf7d6b12e94781195f61ca", "owner": "", "id": "s2:5998b2c580560463eabf7d6b12e94781195f61ca"}, {"kind": "prior_art", "label": "METHODS AND SYSTEMS FOR PROVIDING ADVANCED PAYMENT SOLUTIONS UTILIZING GENERATIVE ARTIFICIAL INTELLIGENCE (AI)-BASED VOICE FINGERPRINT AUTHENTICATION TECHNOLOGY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260212357A1/en", "owner": "NEXTPAYMENTS INC.", "id": "patent:US20260212357A1"}, {"kind": "idea", "label": "Constraint-level zero-knowledge reserve proofs for GENIUS Act stablecoins (eligibility, maturity \u226493 days, concentration) from signed custodian feeds", "arm": "A2b", "run": "2026-09-30", "domain": "crypto", "problem": "GENIUS Act proposals (Treasury, Fed, FDIC) require 1:1 eligible reserves: deposits, T-bills maturing within 93 days, and qualifying repo. Today's attestations are monthly PDFs, and Merkle proofs of reserves only prove totals.", "mechanism": "Custodian banks and the Treasury-bill custodian sign position feeds (CUSIP, maturity, amount; deposit balances per institution). A prover inside the issuer's infrastructure generates a zero-knowledge proof, each block or each hour, that (a) total eligible reserves \u2265 outstanding supply read from the chain; (b) every T-bill in the reserve has remaining maturity \u2264 93 days; (c) no single custodian exceeds the configured concentration share; (d) repo collateral meets its eligibility constraints. It reveals none of the individual positions. The proof and the custodian key commitments are posted on-chain, where wallets, exchanges and supervisors can verify them. A failed constraint triggers automatic mint suspension.", "novelty_pa": 0.2351, "id": "idea:A2b-03"}, {"kind": "theme", "label": "T15", "id": "theme:2026-09-30:T15"}, {"kind": "prior_art", "label": "Stablecoins and the Upcoming Battle for Depositors", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/b1b6aed5f7486f588a4b92869d9a812f27e03ce3", "owner": "", "id": "s2:b1b6aed5f7486f588a4b92869d9a812f27e03ce3"}, {"kind": "prior_art", "label": "Banks in the Age of Stablecoins: Some Possible Implications for Deposits, Credit, and Financial Intermediation", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/e18086e4e4cf2a163ecfe6b2bbf831ac811f7237", "owner": "", "id": "s2:e18086e4e4cf2a163ecfe6b2bbf831ac811f7237"}, {"kind": "prior_art", "label": "Stablecoin Reserve Demand and Treasury Convenience Yields: Private Money, Safe-Asset Scarcity, and the Seigniorage of a Strategic Issuer", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/80c0c58464a20a470b417cb086ae592a2c861e82", "owner": "", "id": "s2:80c0c58464a20a470b417cb086ae592a2c861e82"}, {"kind": "prior_art", "label": "Comparative Analysis\u00a0: GENIUS Act (US) vs. MiCA (EU)", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/c677db02c0046b31ffaa3faea55ee67d81b626e6", "owner": "", "id": "s2:c677db02c0046b31ffaa3faea55ee67d81b626e6"}, {"kind": "idea", "label": "Taint-granular freezing for payment stablecoins: encumbering only the traced sanctioned value rather than whole addresses, with court-signed release", "arm": "A2b", "run": "2026-09-30", "domain": "crypto", "problem": "Issuers must be able to freeze and seize, and must meet BSA/sanctions standards. Address-level blacklists freeze innocent downstream holders and push commerce away from stablecoins.", "mechanism": "The token contract tracks value lineage with a configurable taint policy (FIFO or haircut) over transfers. When the issuer receives a sanctions or court order for identified inflows, the contract places an encumbrance equal to the traced tainted amount on each current holder, blocking only that amount. It emits verifiable lineage proofs, so the holder can transact their untainted balance normally. Release or seizure requires a threshold signature from the issuer compliance key and a court or agency key. Holders can submit a counter-proof, such as a purchase from a licensed exchange before the listing date, to contest.", "novelty_pa": 0.2402, "id": "idea:A2b-04"}, {"kind": "prior_art", "label": "StableAML: Machine Learning for Behavioral Wallet Detection in Stablecoin Anti-Money Laundering on Ethereum", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/d7d980dc80acc36372c02569b5a4c6fb47dbe83b", "owner": "", "id": "arxiv:2602.17842"}, {"kind": "prior_art", "label": "Scaling laws of Stablecoin Transactions: Evidence from USDT and USDC on the Ethereum blockchain", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/2d7c3edba6e6df08135fa974be5745b79184aa74", "owner": "", "id": "arxiv:2608.09378"}, {"kind": "prior_art", "label": "Defending the Peg: Real-Time Dynamic Protection and Anomaly Detection in DeFi Stablecoins", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/3dad9c45ffbad071020fe4b4c97cb81339e1aad7", "owner": "", "id": "arxiv:2608.25600"}, {"kind": "prior_art", "label": "Breaking the stablecoin buck: The attenuating impact of security breach shocks at cryptocurrency exchanges", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/87dc169b9f35e023753b04c00a2ad880f734f056", "owner": "", "id": "s2:87dc169b9f35e023753b04c00a2ad880f734f056"}, {"kind": "prior_art", "label": "SECURELY PROCESSING A CONTINGENT ACTION TOKEN", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260280878A1/en", "owner": "2BC Innovations, LLC", "id": "patent:US20260280878A1"}, {"kind": "idea", "label": "Provable-fairness redemption queue for stablecoins under stress (2-business-day par redemption)", "arm": "A2b", "run": "2026-09-30", "domain": "crypto", "problem": "The GENIUS Act requires timely redemption at par. Under a run, how the redemption queue is ordered becomes contentious, and a first-mover advantage accelerates the run itself.", "mechanism": "Redemption requests are committed on-chain with a timestamp and randomness beacon. The issuer processes them in batches whose ordering rule is fixed in advance (pro-rata within time buckets, with small-holder priority up to a cap) and publishes a Merkle proof of each batch's allocation. Holders can verify their queue position and expected settlement time. Because the ordering rule removes the benefit of redeeming seconds earlier inside a bucket, it damps panic dynamics.", "novelty_pa": 0.2853, "id": "idea:A2b-05"}, {"kind": "prior_art", "label": "Resolution Is Not Settlement, Part II: Protocol Finality and Observed Redemption on Polymarket", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.15373", "owner": "", "id": "arxiv:2609.15373"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR FACILITATING REDEMPTION OF UNIQUE DIGITAL ASSET UTILITY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20230298064A1/en", "owner": "SEEK XR, INC.", "id": "patent:US20230298064A1"}, {"kind": "idea", "label": "Signed tradeline provenance: turning credit-report dispute investigations into cryptographic record comparison with automatic correction on SLA miss", "arm": "A2b", "run": "2026-09-30", "domain": "credit", "problem": "Credit-reporting disputes are overwhelmed. 'Investigation took more than 30 days' reached 238k complaints in 120 days, growing 1.41\u00d7 in share, and 207k say the investigation did not fix the error. Investigations are code exchanges (e-OSCAR) with no record of source-of-truth.", "mechanism": "Each tradeline field a furnisher reports (balance, status, dates, payment history) carries a signed provenance envelope: a hash of the source-system record, the furnisher key, a timestamp and a version. When a consumer disputes a field, the bureau automatically requests the furnisher's signed source record for that version. If the furnisher returns a record whose hash matches and whose content supports the reported value, the dispute is resolved with an evidentiary receipt to the consumer. If it cannot produce a matching signed record within the SLA, the field is suppressed automatically, not merely 'verified'. Mismatches between the reported value and the signed source trigger correction. Status is pushed to the consumer at each step.", "novelty_pa": 0.2511, "id": "idea:A2b-06"}, {"kind": "theme", "label": "T24", "id": "theme:2026-09-30:T24"}, {"kind": "prior_art", "label": "Tradeline fingerprint", "pa_type": "patent", "url": "https://patents.google.com/patent/US11276115B1/en", "owner": "AMERICAN EXPRESS TRAVEL RELATED SERVICES COMPANY, INC.", "id": "patent:US11276115B1"}, {"kind": "prior_art", "label": "Tradeline fingerprint", "pa_type": "patent", "url": "https://patents.google.com/patent/US10497055B2/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US10497055B2"}, {"kind": "prior_art", "label": "TRADELINE FINGERPRINT", "pa_type": "patent", "url": "https://patents.google.com/patent/US20170011458A1/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US20170011458A1"}, {"kind": "prior_art", "label": "INTERNATIONAL TRADE FINANCE BLOCKCHAIN SYSTEM", "pa_type": "patent", "url": "https://patents.google.com/patent/US20180268479A1/en", "owner": "Wells Fargo Bank, N.A.", "id": "patent:US20180268479A1"}, {"kind": "prior_art", "label": "METHODS AND APPARATUSES FOR GENERATING A NEW CREDIT FILE AND ADDING TRADELINES", "pa_type": "patent", "url": "https://patents.google.com/patent/US20230140214A1/en", "owner": "ConsumerInfo.com, Inc.", "id": "patent:US20230140214A1"}, {"kind": "idea", "label": "Mixed-file splitting with consumer-held verifiable credentials for 'information belongs to someone else' disputes", "arm": "A2b", "run": "2026-09-30", "domain": "credit", "problem": "895,197 complaints in 120 days say report information belongs to someone else. Mixed files and synthetic or stolen identities contaminate reports, and bureaus resolve this by fuzzy matching.", "mechanism": "A consumer proves identity attributes once, with a device-bound verifiable credential issued by a bank or government ID wallet that includes a stable pseudonymous subject identifier. When disputing, the consumer signs a challenge listing the tradelines they claim. The bureau's entity-resolution engine re-clusters the file under the hard constraint that tradelines explicitly disowned by a VC-authenticated subject cannot co-reside with that subject's identifier. The disowned records are split into a separate candidate entity, which is then matched to other files and flagged for identity-theft review. The consumer receives a signed record of the split.", "novelty_pa": 0.2573, "id": "idea:A2b-07"}, {"kind": "prior_art", "label": "CONSUMER-AUTHORIZED CONTROLLED DISTRIBUTION OF TRUSTED SOURCE DATA", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260222392A1/en", "owner": "TURBOPASS CORPORATION", "id": "patent:US20260222392A1"}, {"kind": "prior_art", "label": "ISSUANCE AND VERIFICATION OF MULTI-CLAIM VERIFIABLE CREDENTIALS AND VERIFIABLE PRESENTATIONS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260291748A1/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US20260291748A1"}, {"kind": "prior_art", "label": "Issuance and verification of multi-claim verifiable credentials and verifiable presentations", "pa_type": "patent", "url": "https://patents.google.com/patent/US12732380B2/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US12732380B2"}, {"kind": "prior_art", "label": "Systems and methods for recognizing and linking related data files originated by multiple organizations", "pa_type": "patent", "url": "https://patents.google.com/patent/US12645641B1/en", "owner": "Federal Home Loan Mortgage Corporation (Freddie Mac)", "id": "patent:US12645641B1"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR SECURE MATCHING AND LINKING OF DATA ELEMENTS ACROSS INDEPENDENT DATA SYSTEMS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260252538A1/en", "owner": "Verato, Inc.", "id": "patent:US20260252538A1"}, {"kind": "idea", "label": "Agent-herding detection: flagging scam storefronts by the sudden convergence of many users' AI shopping agents on a new merchant", "arm": "A2b", "run": "2026-09-30", "domain": "payments", "problem": "Banks warn that AI shopping bots raise scam and fraud risk. Fake storefronts can be tuned to rank highly in agents' retrieval (agent-SEO, or prompt-injection pages), and one fake merchant can capture thousands of agents at once.", "mechanism": "The issuer or network tags agent-initiated authorisations (agentic tokens identify agent platform and instance). It maintains a streaming convergence detector: for each merchant, the rate of distinct user-agents newly transacting, normalised by the merchant's age, category and historical human traffic. Humans discover merchants gradually and diversely; agents that share retrieval pipelines converge sharply. When convergence far exceeds the human baseline for a merchant with thin history, especially from agents of one platform, the network places the merchant on agent-hold: human confirmation is required and settlement is delayed. It also notifies the agent platform with the retrieval signals involved.", "novelty_pa": 0.181, "id": "idea:A2b-08"}, {"kind": "theme", "label": "T03", "id": "theme:2026-09-30:T03"}, {"kind": "prior_art", "label": "Agentic Commerce Bench: Measuring Fraud Detection for Agents That Spend Money", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/1c5bd066bb15e4e315f063bb886cc50e618f57bd", "owner": "", "id": "arxiv:2609.35886"}, {"kind": "prior_art", "label": "An AI Security Agent for Banking: Multi-Vector Fraud and AML Detection Across Retail and Corporate Accounts", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/12599efca581f66ef72c3de0b9d457f97741668e", "owner": "", "id": "arxiv:2606.17555"}, {"kind": "prior_art", "label": "AI-Based Fraud Detection in Digital Payment Systems", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/927bc8adf94b2ad4682f1eb436152e1bb8c2da2e", "owner": "", "id": "s2:927bc8adf94b2ad4682f1eb436152e1bb8c2da2e"}, {"kind": "idea", "label": "Network-run red-team canaries: continuous certification of AI shopping agents against prompt injection using honeypot storefronts", "arm": "A2b", "run": "2026-09-30", "domain": "payments", "problem": "Issuers cannot inspect agent platforms' robustness, but they carry the fraud liability when agents are manipulated.", "mechanism": "The payment network runs synthetic honeypot storefronts and product listings carrying graded prompt-injection payloads, for example hidden instructions to change the shipping address, pay a different merchant, or disclose credentials. Test users' agents of each platform version are routinely directed at them through normal retrieval. Agent behaviour is scored automatically: whether the agent attempted a payment to a canary merchant ID or deviated from the mandate. The resulting robustness score is bound to the agent platform's token-requestor credentials, and issuers scale token scopes and limits to it. A regression immediately narrows scopes network-wide.", "novelty_pa": 0.1599, "id": "idea:A2b-09"}, {"kind": "prior_art", "label": "Protocol-Level Attacks on Agentic Commerce Platforms: A Cross-Platform Taxonomy, AIP-Bench, and Unified Defense", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/242f6ce9c9198cabefd431f097a5d5793ee41d31", "owner": "", "id": "arxiv:2607.21824"}, {"kind": "idea", "label": "Pass-through deposit-insurance ledger for fintech custodial accounts with instant per-owner coverage proofs", "arm": "A2b", "run": "2026-09-30", "domain": "regtech", "problem": "Post-Synapse, the FDIC's custodial-account recordkeeping proposals and the regulatory resets exist because owners of pooled for-benefit-of balances could not be identified or paid quickly after failure.", "mechanism": "Each end-user balance held at a sponsor bank through a fintech is recorded in a per-owner pass-through ledger kept at the bank, not only at the fintech. It is updated from signed fintech sub-ledger deltas with Merkle inclusion proofs and reconciled daily. The ledger computes coverage per ownership category and per insured bank in real time. Each owner can obtain a signed coverage proof (insured amount, bank, category). The FDIC receives a machine-readable pass-through file that allows payout on day 1 after failure.", "novelty_pa": 0.2741, "id": "idea:A2b-10"}, {"kind": "theme", "label": "T29", "id": "theme:2026-09-30:T29"}, {"kind": "prior_art", "label": "CUSTODIAL SYSTEMS FOR NON-FUNGIBLE TOKENS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20230104103A1/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US20230104103A1"}, {"kind": "prior_art", "label": "Distributed ledger based multi-currency clearing and settlement", "pa_type": "patent", "url": "https://patents.google.com/patent/US12340365B2/en", "owner": "PARTIOR PTE. LTD", "id": "patent:US12340365B2"}, {"kind": "prior_art", "label": "DISTRIBUTED LEDGER BASED MULTI-CURRENCY CLEARING AND SETTLEMENT", "pa_type": "patent", "url": "https://patents.google.com/patent/US20220374880A1/en", "owner": "PARTIOR PTE. LTD", "id": "patent:US20220374880A1"}, {"kind": "prior_art", "label": "Distributed ledger system for managing smart data", "pa_type": "patent", "url": "https://patents.google.com/patent/US12711556B2/en", "owner": "STATE FARM MUTUAL AUTOMOBILE INSURANCE COMPANY", "id": "patent:US12711556B2"}, {"kind": "prior_art", "label": "Security deposits using tokenized reputation scores", "pa_type": "patent", "url": "https://patents.google.com/patent/US12682381B2/en", "owner": "eBay Inc.", "id": "patent:US12682381B2"}, {"kind": "idea", "label": "Debt chain-of-title ledger with open-banking proof-of-payment matching to stop collection of debts not owed", "arm": "A2b", "run": "2026-09-30", "domain": "credit", "problem": "41,086 complaints in 120 days about attempts to collect debt not owed, many where the debt had already been paid. Debts are sold repeatedly with broken documentation.", "mechanism": "Every debt assignment is recorded as a hash-linked title record containing the balance, payment history digest and the seller's signature. A collector's system must present a valid chain of title from the original creditor before any collection communication is generated. When a consumer disputes, the consumer app pulls payment evidence from their bank through open-banking APIs and matches it to the creditor account by payment reference, amount and date. It then issues a signed proof-of-payment object that the ledger attaches to the debt, and further collection is blocked automatically.", "novelty_pa": 0.2744, "id": "idea:A2b-11"}, {"kind": "theme", "label": "T10", "id": "theme:2026-09-30:T10"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR ELECTRONIC CONSUMER DEBT VALIDATION AND DISPUTE PROCESS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20160328791A1/en", "owner": "GDR ACQUISITION COMPANY LLC", "id": "patent:US20160328791A1"}, {"kind": "prior_art", "label": "SYSTEMS AND METHODS FOR VERIFYING DATA VIA BLOCKCHAIN", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260187264A1/en", "owner": "STATE FARM MUTUAL AUTOMOBILE INSURANCE COMPANY", "id": "patent:US20260187264A1"}, {"kind": "prior_art", "label": "Hybrid blockchain network for dynamic cross-account transfer operations", "pa_type": "patent", "url": "https://patents.google.com/patent/US12711496B1/en", "owner": "State Farm Mutual Automobile Insurance Company", "id": "patent:US12711496B1"}, {"kind": "prior_art", "label": "Method and system of identifying and reducing scalping using distributed ledgers", "pa_type": "patent", "url": "https://patents.google.com/patent/US12705624B2/en", "owner": "Mastercard International Incorporated", "id": "patent:US12705624B2"}, {"kind": "idea", "label": "Attenuable delegation chains for multi-agent payments: macaroon-style caveats that sub-agents can only narrow, verified by the issuer", "arm": "A2b", "run": "2026-09-30", "domain": "payments", "problem": "'Agentic commerce is an authorisation problem.' A user's agent delegates to a travel agent-bot, which delegates to an airline's agent. Today's mandates are single-hop and cannot express how authority narrows along the chain.", "mechanism": "The user's bank issues a root capability token for an agent: a chained-HMAC or signature caveat list covering budget, categories, merchants, time window and number of uses. Each agent can derive a child token for a sub-agent by appending caveats. It can only add restrictions, never remove them, and the chain structure proves this. The final agent presents the full caveat chain with the authorisation. The issuer verifies the chain against the root key in constant time per caveat and evaluates all caveats against the transaction. Revoking any link revokes all its descendants, and every hop is visible for dispute attribution.", "novelty_pa": 0.2187, "id": "idea:A2b-12"}, {"kind": "theme", "label": "T25", "id": "theme:2026-09-30:T25"}, {"kind": "prior_art", "label": "Compliance-Aware Agentic Payments on Stablecoin Rails", "pa_type": "paper", "url": "https://arxiv.org/abs/2605.00071", "owner": "", "id": "arxiv:2605.00071"}, {"kind": "prior_art", "label": "AGENTIC MICROTRANSACTIONS THROUGH VERIFIABLE PAYMENT DELEGATION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260154681A1/en", "owner": "Mastercard International Incorporated", "id": "patent:US20260154681A1"}, {"kind": "idea", "label": "Consumer-signed permissible-purpose tokens for credit report pulls", "arm": "A2b", "run": "2026-09-30", "domain": "credit", "problem": "356k complaints about improper use of reports. Pulls happen without verifiable consumer authorisation, and freezes are blunt on/off switches.", "mechanism": "A consumer's wallet issues short-lived pull tokens bound to the requesting lender's identity, the permissible purpose, the product and the time window, signed by a device key. The bureau releases a report only against a valid token, or an explicit statutory exception, which is logged separately. Tokens can be one-time, limited to a soft or hard pull, and revoked. Consumers see a signed access log. Lenders integrate through a redirect or QR flow similar to account-aggregator consent artefacts.", "novelty_pa": 0.2945, "id": "idea:A2b-13"}, {"kind": "theme", "label": "T07", "id": "theme:2026-09-30:T07"}, {"kind": "prior_art", "label": "SYSTEM AND METHOD FOR PULLING A CREDIT OFFER ON BANK'S PRE-APPROVED PROPERTY", "pa_type": "patent", "url": "https://patents.google.com/patent/US20160371741A1/en", "owner": "Segmint Inc.", "id": "patent:US20160371741A1"}, {"kind": "prior_art", "label": "Method and system for offering a credit product by a credit issuer to a consumer at a point-of-sale", "pa_type": "patent", "url": "https://patents.google.com/patent/US12700034B2/en", "owner": "PayPal, Inc.", "id": "patent:US12700034B2"}, {"kind": "prior_art", "label": "METHOD OF PULL-BASED REAL TIME PAYMENT AUTHORIZATION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260037943A1/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US20260037943A1"}, {"kind": "prior_art", "label": "NON-REPUDIATION PROCESS FOR CREDIT APPROVAL AND IDENTITY THEFT PREVENTION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20190012732A1/en", "owner": "CreditRegistry Corporation", "id": "patent:US20190012732A1"}, {"kind": "prior_art", "label": "METHOD OF PULL-BASED REAL TIME PAYMENT AUTHORIZATION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20240220950A1/en", "owner": "American Express Travel Related Services Company, Inc.", "id": "patent:US20240220950A1"}, {"kind": "idea", "label": "Purchase-session binding for UPI: aggregating split payments per merchant session for correct MDR and fewer false fraud flags", "arm": "A2b", "run": "2026-09-30", "domain": "payments", "problem": "RBI backs MDR on UPI payments above \u20b92,000, which gives merchants and payers an incentive to split payments. Banks already flag repeated \u20b92,000 payments as suspicious, which hurts legitimate split payments.", "mechanism": "A merchant QR or intent carries a session identifier signed by the merchant's PSP, derived from the cart/bill. Payments carrying the same session ID within a window are aggregated at the acquirer for MDR computation, removing the split-to-evade incentive. On the risk side, the payer's PSP treats payments sharing a verified session ID as one purchase, so legitimate splits (limits, multiple sources) are not flagged. Splits without a session ID, to the same payee in a short window, keep full scrutiny.", "novelty_pa": 0.2613, "id": "idea:A2b-14"}, {"kind": "theme", "label": "T04", "id": "theme:2026-09-30:T04"}, {"kind": "prior_art", "label": "PAYMENT FAILURES AND REVENUE DISRUPTION: ASSESSING THE RELIABILITY GAP IN UPI ADOPTION AMONG INDIA'S INFORMAL VENDORS", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/730b996e83ae9924d5b368c828ebe675def30c36", "owner": "", "id": "s2:730b996e83ae9924d5b368c828ebe675def30c36"}, {"kind": "prior_art", "label": "A STUDY ON CONSUMER AWARENESS, USAGE, AND PREFERENCE TOWARDS UNIFIED PAYMENTS INTERFACE (UPI) IN CHENNAI CITY", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/d312950cd3dc28438740b6ba825465681e820856", "owner": "", "id": "s2:d312950cd3dc28438740b6ba825465681e820856"}, {"kind": "prior_art", "label": "Digital Payment Adoption and Consumer Spending Behaviour in India: Evidence from UPI Growth, Convenience and Trust (2020\u20132026)", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/1be796025de213ef746714b0effc2513803069b9", "owner": "", "id": "s2:1be796025de213ef746714b0effc2513803069b9"}, {"kind": "prior_art", "label": "TOKENIZED DATA HAVING SPLIT PAYMENT INSTRUCTIONS FOR MULTIPLE ACCOUNTS IN A CHAIN TRANSACTION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20200286053A1/en", "owner": "PayPal, Inc.", "id": "patent:US20200286053A1"}, {"kind": "prior_art", "label": "TOKENIZED DATA HAVING SPLIT PAYMENT INSTRUCTIONS FOR MULTIPLE ACCOUNTS IN A CHAIN TRANSACTION", "pa_type": "patent", "url": "https://patents.google.com/patent/US20170091722A1/en", "owner": "PAYPAL, INC.", "id": "patent:US20170091722A1"}, {"kind": "idea", "label": "'Digital arrest' coercion-state detector with physically separated release ritual", "arm": "A2b", "run": "2026-09-30", "domain": "fraud", "problem": "Deepfake-backed 'digital arrest' rackets keep victims on long video calls with fake police while they transfer crores. The victim is coerced, so friction inside the app is simply overridden.", "mechanism": "The banking app fuses on-device signals (with consent): concurrent long-duration video call, screen sharing active, repeated balance checks, a first-time high-value payee, typing hesitation and copy-paste of beneficiary details. From these it infers a coercion state. In that state the app does not ask 'are you sure?'. It requires a release ritual that the remote coercer cannot supervise and that breaks the call: end the call, then after a mandatory 30-minute gap confirm the transfer at an ATM or branch with the physical card, or have it confirmed by a pre-registered trusted person. Meanwhile the app plays a verified-number callback from the bank's anti-fraud line.", "novelty_pa": 0.2444, "id": "idea:A2b-15"}, {"kind": "theme", "label": "T16", "id": "theme:2026-09-30:T16"}, {"kind": "prior_art", "label": "Digital Arrest Using Artificial Intelligence Generative Deepfake Media Content in Post-Truth Society", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/18e6beb7ddcf1b6e07e1410846a9dcdffbb3a31e", "owner": "", "id": "s2:18e6beb7ddcf1b6e07e1410846a9dcdffbb3a31e"}, {"kind": "prior_art", "label": "User Authentication and Transaction Verification via a Shared Video Stream", "pa_type": "patent", "url": "https://patents.google.com/patent/US20230230085A1/en", "owner": "IRONVEST, INC.", "id": "patent:US20230230085A1"}, {"kind": "prior_art", "label": "DEEPFAKE TECHNOLOGIES AS A NEW TOOL FOR COMMITTING CRIMINAL OFFENCES: A COMPARATIVE STUDY", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/2aeb1f0b3c37f2bab29cf61285ced11ac4ec116b", "owner": "", "id": "s2:2aeb1f0b3c37f2bab29cf61285ced11ac4ec116b"}, {"kind": "prior_art", "label": "CRIMES INVOLVING DEEPFAKE IN ONLINE FRAUD AND THE CHALLENGES OF PROVING THEM", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/1b0d2484109e522562ae554b8bb476fdc04cd286", "owner": "", "id": "s2:1b0d2484109e522562ae554b8bb476fdc04cd286"}, {"kind": "prior_art", "label": "User authentication and transaction verification via a shared video stream", "pa_type": "patent", "url": "https://patents.google.com/patent/US12493879B2/en", "owner": "IRONVEST, INC.", "id": "patent:US12493879B2"}, {"kind": "idea", "label": "Merchant-verifiable signed payment receipts to defeat fake 'frozen-screen' UPI success screens", "arm": "A2b", "run": "2026-09-30", "domain": "payments", "problem": "In the 'frozen-screen' UPI scam, fraudsters show merchants a fake or frozen success screen. Merchants without a soundbox cannot verify that a credit really arrived.", "mechanism": "On successful debit, the payer app renders a receipt code: a QR or ultrasonic burst carrying a token signed by the payee's PSP that includes the merchant's session nonce, amount and UTR. The merchant's phone, or a cheap verifier, checks the signature and nonce offline against the merchant PSP's public key. A static or fake screen cannot produce a valid signature for the live nonce.", "novelty_pa": 0.3012, "id": "idea:A2b-16"}, {"kind": "prior_art", "label": "Remote Template Based Receipt Generation", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260268299A1/en", "owner": "Block, Inc.", "id": "patent:US20260268299A1"}, {"kind": "prior_art", "label": "Merchant Verification of In-person Electronic Transactions", "pa_type": "patent", "url": "https://patents.google.com/patent/US20130151419A1/en", "owner": "Hitchcock; Daniel W., Canavor; Darren E., Ramalingam; Harsha, Hanson; Robert, Campbell; Brad Lee", "id": "patent:US20130151419A1"}, {"kind": "prior_art", "label": "System and Method for Authenticating Transactions Through a Mobile Device", "pa_type": "patent", "url": "https://patents.google.com/patent/US20140156531A1/en", "owner": "SALT Technology Inc.", "id": "patent:US20140156531A1"}, {"kind": "prior_art", "label": "Payment using unique product identifier codes", "pa_type": "patent", "url": "https://patents.google.com/patent/US12694439B2/en", "owner": "PayPal, Inc.", "id": "patent:US12694439B2"}, {"kind": "prior_art", "label": "TRUSTED STORED-VALUE PAYMENT SYSTEM THAT INCLUDES UNTRUSTED MERCHANT TERMINALS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20110178884A1/en", "owner": "", "id": "patent:US20110178884A1"}, {"kind": "idea", "label": "Comprehension-verified scam warnings with tamper-evident 'reasonable steps' receipts", "arm": "A1", "run": "2026-10-01", "domain": "fraud", "problem": "Scam-reimbursement regimes (Australia's AFCA scam rules, UK APP reimbursement) judge banks on whether they took reasonable steps, yet banks cannot prove a warning was understood. Research shows standard security notifications fail users with intellectual and developmental disabilities, and such users are over-represented among victims.", "mechanism": "When a payment triggers a scam warning, a rendering engine picks the warning format from the customer's accessibility profile and recent interaction signals: plain-language chunks, pictograms, read-aloud audio, or a step-by-step version. It then asks one comprehension question generated from the specific risk, for example 'Who told you to make this payment?' with three choices including 'someone I met online'. The answer, the response time and the format shown are hashed with the payment digest into a signed warning receipt and appended to a tamper-evident log. A wrong or rushed answer escalates to a human call-back. Receipts are later produced as evidence of reasonable steps in disputes and regulatory reviews.", "novelty_pa": 0.2754, "id": "idea:A1-1001-01"}, {"kind": "source", "label": "Banks face an impossible bind in AFCA\u2019s proposed \u2018Scam Rules\u2019 - Banking Day", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMijgFBVV95cUxNVTNONXVkZnZ0UEhfT1M5aGZNUl9FbG8zV2ZwMUxWdGtfRXFXbEFZM3VkLUd3S3lqQkhrdFlpWDFNN3gtSng5N2VvNkxpMjdfb1dQVTdZWlRvQjVERWFaZURySldJT2UxSVFBbGFDQm1fSnk1RkZLZ3BQUGRQV1JIbi11RHU1ZGgtdlJJT2Zn?oc=5", "id": "news:6c09a24e018c4ffd"}, {"kind": "source", "label": "\"I'm trying not to get hacked:\" How Adults with Intellectual and Developmental Disabilities Navigate Security and Privac", "src_kind": "paper", "url": "https://arxiv.org/abs/2610.02374", "id": "arxiv:2610.02374"}, {"kind": "prior_art", "label": "Beyond Successful Authentication: Reconstructing the Evidentiary Architecture of Payment-fraud Liability under PSD2 in Light of Eurobank Bulgaria and the Pendin", "pa_type": "paper", "url": "https://doi.org/10.2139/ssrn.7426879", "owner": "", "id": "doi:10.2139/ssrn.7426879"}, {"kind": "prior_art", "label": "IDENTIFYING AND REMEDIATING SCAM ELECTRONIC MESSAGES", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260006044A1/en", "owner": "RANGERS.AI", "id": "patent:US20260006044A1"}, {"kind": "prior_art", "label": "Electronic Devices and Corresponding Methods for Presenting Fraud Warnings for Transaction Reversal Requests", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250069082A1/en", "owner": "Motorola Mobility LLC", "id": "patent:US20250069082A1"}, {"kind": "prior_art", "label": "EXPLAINABLE FRAUD DETECTION ALERTS", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260187658A1/en", "owner": "Intuit Inc.", "id": "patent:US20260187658A1"}, {"kind": "prior_art", "label": "Clean Scores, Buried Evidence, and Confident Wrong: A Receipt-Based Audit of Frontier Agentic QA", "pa_type": "paper", "url": "https://arxiv.org/abs/2609.15319", "owner": "", "id": "arxiv:2609.15319"}, {"kind": "idea", "label": "Payee-label semantics: scam narratives revealed by the names victims are told to give payees", "arm": "A1", "run": "2026-10-01", "domain": "fraud", "problem": "Bank staff stopped a \u00a313,500 scam only because the victim's payees were labelled 'Donald Trump', 'Kim Kardashian' and 'Jennifer Lawrence'. Each payment passed every automated check; the narrative the scammer planted lived only in free-text fields that no model reads.", "mechanism": "At payee creation and payment time, an on-device or server classifier reads the user-entered payee nickname and payment reference and compares them with the confirmation-of-payee legal name. Signals include: the label names a public figure, a celebrity or a government agency; the label suggests an investment, customs fee, release fee or 'unlock' payment; and the semantic distance between the label and the legal name is large. These label features are combined with the cumulative flows to such payees over the session, so a series of individually ordinary payments is caught as one pattern. Hits trigger a narrative-specific warning ('A celebrity will never ask you for money') and a human call-back.", "novelty_pa": 0.3137, "id": "idea:A1-1001-02"}, {"kind": "source", "label": "Lloyds Bank staff save man from being conned out of \u00a313,500 - after scam involving sending money to names including 'Don", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMivwJBVV95cUxOWFh1TlBSVVU5djVpV2JMNWJnb0JzZ1cwZVd5V0xrZUVNQi1fQ3dzeHBPV29CeFBYNUliOG5SbzRuMlNDbGJBNVJiam03WmZHaWlfeG9SX2ZPM2hrWkVJcU9yTHo0S1ZzcUl3bUVFcDdHa1ZCdFRuaGJfZ0dRQ3BIUlo3c0Z4ODI0UHNfMkJYbE94TTVMaWRfR19KZ0cxdUhzR0JhcnZhbzRiWmpqWklWZXV3endXcTFaakFwcFZtSW45QWpGR2l1VXVtYThoMFI3RVREUUZlcVNxQkZWbm0xWVNPNnBtdEVxSGpqMGFpUXRxUDRHemZRQy1UMlRraGhQWmRtRmQ2WVM2LUpRN3JaWmdjMXFPVFpiNkQ4aFdGTUVhYlFvbVpqcTVlTFFuWEN6eXZCVTJHWXhSbnNZaVdz?oc=5", "id": "news:9a1f83320fe7bc8b"}, {"kind": "source", "label": "Local Consistency Does Not Guarantee Global Conservation: Auditing Zero-Shot Composition of Airway Flow Operators", "src_kind": "paper", "url": "https://arxiv.org/abs/2610.02056", "id": "arxiv:2610.02056"}, {"kind": "prior_art", "label": "Detection, Attribution, Narration: An End-to-End Pipeline for Explainable Money Mule Identification", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/4f3c5bae954aa56824deca156e5c43ff4e203ec2", "owner": "", "id": "arxiv:2607.17586"}, {"kind": "prior_art", "label": "Communicating Credit Risk with Large Language Models: Evaluation of Explanations from Standard and Alternative Data-Based Models", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/41c34c292c507e60763a07e042f9b0e18259201e", "owner": "", "id": "arxiv:2608.17715"}, {"kind": "prior_art", "label": "Machine Learning for Digital Payment Fraud Detection in Financial Institutions: A Review of Methods, Explainability, and Performance", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/59f88834c6f1898dc23068c99aca2de118a6adfc", "owner": "", "id": "s2:59f88834c6f1898dc23068c99aca2de118a6adfc"}, {"kind": "prior_art", "label": "EXPLAINABLE FRAUD DECISIONING SYSTEM LEVERAGING LARGE LANGUAGE MODELS (\"LLMS\") AND INTERPRETABLE NEURAL NETWORKS (\"INNS\")", "pa_type": "patent", "url": "https://patents.google.com/patent/US20260245095A1/en", "owner": "Bank of America Corporation", "id": "patent:US20260245095A1"}, {"kind": "idea", "label": "Blendshape-residual liveness: detecting real-time deepfake avatars in video KYC from motion that a low-rank face basis cannot express", "arm": "A1", "run": "2026-10-01", "domain": "identity", "problem": "Video-based customer onboarding (India's V-CIP, remote account opening) is attacked with real-time animated avatars. New research shows such avatars can be closely approximated by a small, identity-independent linear blendshape basis, which makes cheap live deepfakes practical.", "mechanism": "During the video call, the system fits a low-rank blendshape model to the tracked face mesh in each frame and measures the residual deformation it cannot explain. Real faces produce persistent non-linear residuals: skin compression, wrinkles, asymmetric micro-expressions. Blendshape-driven avatars leave near-zero residual. The session also issues randomised physical-deformation challenges designed to maximise residual on real faces, such as pressing a finger into the cheek, puffing one cheek or pulling the lower lip. Liveness is scored from the residual energy against the challenge timeline; a low residual under deformation challenges flags a synthetic face.", "novelty_pa": 0.1877, "id": "idea:A1-1001-03"}, {"kind": "source", "label": "Fiserv Digital Asset Platform Goes Live with Financial - GlobeNewswire", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMiogJBVV95cUxQdk85RHJqMDNFLTQyTUpFOXF1ZnJoOFI3dGxVRmFrclRaZTJGRFd5NjcwU09oc0Jsa3BQd3RJRmw0NUNzXzRXTVdUc20tYjdueEtLeXFsNzlaaHkxQUtOYWt2bC1RVTNXMVNpV2x5TU5hbGRXYkxpOHYzbmNqaHo0b0hVR0RrVmJ3RDhJUGpGUzNzMWVfYWx1c0doYkdmZlVRaFI3bE1DcHl4QWQ3UVNaWWQ0OTR1XzZYUlp2WHo1S3ExRk9pNTc2MDFxb040UGczUWpHZm9pUHEya3E2TzFmRG1fNnE4dy11cEMzV1poVUJqelpxWERKQndFdDFHb1BxQ3VXeU5MOHdnRVpvOFg0bkQtTDJUZ0lqcjRXQnBqTUxXQQ?oc=5", "id": "news:1087f10882fca04e"}, {"kind": "source", "label": "One Basis to Animate Them All: Gaussian Blendshape Distillation for Real-Time Avatars", "src_kind": "paper", "url": "https://arxiv.org/abs/2610.02207", "id": "arxiv:2610.02207"}, {"kind": "prior_art", "label": "Real-Time Deepfake Recognition", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/87674657f4a9664d97d372cfe1c0f10b25d30731", "owner": "", "id": "s2:87674657f4a9664d97d372cfe1c0f10b25d30731"}, {"kind": "prior_art", "label": "Liveness detection based on motion, face, and context cues", "pa_type": "patent", "url": "https://patents.google.com/patent/US12300035B1/en", "owner": "Amazon Technologies, Inc.", "id": "patent:US12300035B1"}, {"kind": "prior_art", "label": "3D Spatiotemporal Model for Detection of Compressed Deepfake Videos", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/11f5300964aab5cd85dfc9b035f7a8071879c3a9", "owner": "", "id": "s2:11f5300964aab5cd85dfc9b035f7a8071879c3a9"}, {"kind": "prior_art", "label": "Detection of Image-Based Deepfake using Deep Transfer Learning Algorithms", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/9dff2804b462f4eb3d3318550ce26ec8257c844f", "owner": "", "id": "s2:9dff2804b462f4eb3d3318550ce26ec8257c844f"}, {"kind": "prior_art", "label": "Detecting Deepfake Videos Using Hybrid Machine Learning Models", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/6b8b26374cebd7ef6ff26b151aa5bf9c80c52dca", "owner": "", "id": "s2:6b8b26374cebd7ef6ff26b151aa5bf9c80c52dca"}, {"kind": "idea", "label": "Collusion-resistant aggregation of crowd-sourced scam reports for pre-payment payee checks", "arm": "A1", "run": "2026-10-01", "domain": "fraud", "problem": "Pre-payment payee checks increasingly use crowd reports of scam accounts and numbers (national reporting portals, bank-app 'report this payee'). Scammers can poison them in both directions: mass-flagging legitimate competitors, or vouching for their own mules.", "mechanism": "Each report is modelled as a rater-item edge in a bipartite graph. Rater reliability is estimated with peer-assessment integrity methods: agreement with later ground truth (confirmed fraud reports, account closures), detection of collusive rater clusters (synchronised timing, shared devices, reciprocal patterns), and down-weighting of raters whose reports concentrate on a single item. Each payee receives a reliability-weighted scam score with a confidence interval. The payee check returns the score band and confidence instead of a raw report count, and the bank logs which raters' reports were discounted and why.", "novelty_pa": 0.2157, "id": "idea:A1-1001-04"}, {"kind": "source", "label": "CBI\u2019s Fratini Passi on Stopping Fraud Before the Money Moves - The Fintech Times", "src_kind": "news", "url": "https://news.google.com/rss/articles/CBMikgFBVV95cUxONkhpVVJteVlkMWZYS1NWeEFJNG0xRVEtWDVtLUhOUGF1bGJjRFg4azJsYWE1ZUFxb1ZmbnpqSVJOazFwZmNLNHRUSk0zandsTmNhX3BiU3NnVk5YejJqZkN5cnVEOHFtWlZkWTRFTHdpSFRSaFFpemRCUjFJUkh0V1N6VmQ0enNtOUt3S2ptdUN1Zw?oc=5", "id": "news:c90fe8517afdbfd4"}, {"kind": "source", "label": "Scaling Peer Assessments: An Integrity Report from a Large Engineering Internship", "src_kind": "paper", "url": "https://arxiv.org/abs/2610.01020", "id": "arxiv:2610.01020"}, {"kind": "prior_art", "label": "Multisource Fraud Intelligence Using Graph Neural Networks for Merchant, Account, and Transaction Risk Assessment", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/764eb9e9efc690177710684ac9bf0fee3aff0325", "owner": "", "id": "s2:764eb9e9efc690177710684ac9bf0fee3aff0325"}, {"kind": "prior_art", "label": "Mechanism for identifying collusive attackers", "pa_type": "patent", "url": "https://patents.google.com/patent/US12513168B2/en", "owner": "Nokia Solutions and Networks Oy", "id": "patent:US12513168B2"}, {"kind": "prior_art", "label": "A Big Data Framework for Identifying Coordinated Fraud Clusters through Behavioral Pattern Mining", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/ce633f0560e0a56a61892c38e9512cd1f5357bfc", "owner": "", "id": "s2:ce633f0560e0a56a61892c38e9512cd1f5357bfc"}, {"kind": "idea", "label": "Exception-only merchant re-KYC for payment aggregators using signed government data trails", "arm": "A2b", "run": "2026-10-01", "domain": "regtech", "problem": "Payment aggregators are asking RBI for more time on merchant re-KYC deadlines. Re-verifying millions of small merchants by documents and video is slow and expensive, although most merchants already leave signed digital trails.", "mechanism": "For each merchant the aggregator automatically gathers digitally signed government and network records: GST e-invoice IRN signatures, GSTR filing status, Udyam registration, settlement-account ownership confirmed through account-aggregator consent, and UPI collection patterns. A rules-plus-model engine compares them with the merchant's onboarding KYC. Consistent, signature-verified merchants are re-KYC'd automatically and receive a signed re-KYC record. Only mismatches (name or PAN drift, a dormant GST registration, a settlement account in a different name, a sudden category change) go to manual or video re-KYC.", "novelty_pa": 0.2711, "id": "idea:A2b-1001-01"}, {"kind": "theme", "label": "T01", "id": "theme:2026-10-01:T01"}, {"kind": "prior_art", "label": "Methods and systems for identifying a re-routed transaction", "pa_type": "patent", "url": "https://patents.google.com/patent/US12725159B2/en", "owner": "MASTERCARD INTERNATIONAL INCORPORATED", "id": "patent:US12725159B2"}, {"kind": "prior_art", "label": "System and Method for Authenticating Transactions Through a Mobile Device", "pa_type": "patent", "url": "https://patents.google.com/patent/US20120150742A1/en", "owner": "Xtreme Mobility Inc.", "id": "patent:US20120150742A1"}, {"kind": "idea", "label": "Recovery-scam shield: protected mode and a signed official recovery channel for people who were just scammed", "arm": "A2b", "run": "2026-10-01", "domain": "fraud", "problem": "'The bigger problem comes after the scam': victims who report fraud are re-targeted by fake 'fund recovery' agents, lawyers and police impersonators asking for processing fees. Modern syndicates move faster than defences, and victims cannot tell genuine recovery contact from a second scam.", "mechanism": "When a customer reports a scam (bank channel, 1930/NCRP or a similar portal), their account enters a time-boxed protected mode. New payees whose label, reference or merchant category matches recovery, legal-fee, tax-clearance or 'release' narratives trigger a hard stop with a call-back. Large transfers to first-time payees get a mandatory delay. Every genuine recovery communication from the bank or partner law-enforcement agency is delivered as a signed message in the bank app's 'official recovery' inbox, with the case ID and the next steps. Any outside contact claiming to be about recovery can be checked in-app against that inbox, and the app states plainly that genuine recovery never asks for fees.", "novelty_pa": 0.3084, "id": "idea:A2b-1001-02"}, {"kind": "theme", "label": "T02", "id": "theme:2026-10-01:T02"}, {"kind": "prior_art", "label": "Online Financial Fraud in India: A Legal and Criminological Study", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/926e1e4e972143e875d9d59981e5cd562fd24896", "owner": "", "id": "s2:926e1e4e972143e875d9d59981e5cd562fd24896"}, {"kind": "prior_art", "label": "Stopping fraud at every step", "pa_type": "paper", "url": "https://doi.org/10.1093/9780198972877.003.0107", "owner": "", "id": "doi:10.1093/9780198972877.003.0107"}, {"kind": "prior_art", "label": "Systems and Methods for Detecting Network Rerouting", "pa_type": "patent", "url": "https://patents.google.com/patent/US20250335923A1/en", "owner": "The PNC Financial Services Group, Inc.", "id": "patent:US20250335923A1"}, {"kind": "idea", "label": "Member-attributed reserve tranches for multi-issuer shared stablecoins", "arm": "A2b", "run": "2026-10-01", "domain": "crypto", "problem": "A shared stablecoin backed by a consortium (Open USD with Coinbase, Mastercard, Stripe and Visa committing $1B of liquidity) pools reserves contributed and custodied by many members. If one member's custodian fails or is seized, holders cannot see which tokens are affected, and the consortium has no automatic rule for who absorbs the loss.", "mechanism": "Each member's reserve contribution is recorded as a tranche with its own signed custodian attestation feed. A consortium contract maintains the mapping from circulating supply to tranches pro rata, plus an attestation freshness and health score for each tranche. When a tranche's attestation goes stale or fails a check, that member's minting is suspended automatically. Recapitalisation calls are issued to the remaining members under pre-agreed waterfall rules, and a public proof shows that supply is still fully backed by healthy tranches. Redemptions draw from healthy tranches first.", "novelty_pa": 0.2672, "id": "idea:A2b-1001-03"}, {"kind": "theme", "label": "T18", "id": "theme:2026-10-01:T18"}, {"kind": "prior_art", "label": "Stablecoins as private money: a policy agenda", "pa_type": "paper", "url": "https://www.semanticscholar.org/paper/f8438a437b44d2122255f7988f1a22aa7eddace2", "owner": "", "id": "s2:f8438a437b44d2122255f7988f1a22aa7eddace2"}, {"kind": "prior_art", "label": "Reserve-backed tokens : A money for the future?", "pa_type": "paper",
