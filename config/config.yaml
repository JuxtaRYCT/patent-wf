  created_after_days: 90
  per_topic: 30

# ---------------------------------------------------------------- Approach 2
scanner:
  cfpb_window_days: 120
  cfpb_baseline_days: 365
  cfpb_narratives_per_issue: 60
  federal_register_agencies:
    - consumer-financial-protection-bureau
    - federal-reserve-system
    - comptroller-of-the-currency
    - federal-deposit-insurance-corporation
    - financial-crimes-enforcement-network
    - securities-and-exchange-commission
    - treasury-department
  federal_register_days: 240

# ---------------------------------------------------------------- Filtration
novelty:
  # Relevance gate (added after run-1 finding: pure distance-novelty ranks off-topic noise highest).
  # finance-pool items must score >= relevance_min against these anchors (bge query mode, max cosine).
  relevance_min: 0.51
  crossdomain_min_chars: 400      # mechanism pool: real papers with substantive abstracts only
  anchors:
    - bank fraud detection and prevention
    - payment processing and card transactions
    - credit risk and lending decisions
    - anti-money laundering transaction monitoring
    - deposit accounts and bank liquidity
    - stablecoins, tokenized deposits and digital currency
    - securities trading and market microstructure
    - insurance underwriting and claims
    - open banking and financial data sharing
    - identity verification and KYC for financial services
    - scams and social engineering targeting bank customers
    - financial regulation and supervision of banks
    - asset management and portfolio optimization
    - consumer credit reporting and disputes
    - cross-border remittances and foreign exchange
    - financial inclusion and digital payments in emerging markets
  dense_weight: 0.75
  lexical_weight: 0.25
  shortlist_percentile: 80      # items above this novelty percentile go to LLM scoring
  near_duplicate_threshold: 0.92

synthesis:
  min_usefulness: 4             # only LLM-scored items with usefulness >= this enter the P / M pools
  distance_band: [0.55, 0.85]   # percentile band of problem-mechanism distance ("far but bridgeable")
  pairs: 60
  mmr_lambda: 0.6
